# Workspace of the Rust port (DEC-43). Go stays the reference until parity.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Canaill51/superview"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
