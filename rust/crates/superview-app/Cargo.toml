[package]
name = "superview-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "superview"
path = "src/main.rs"

[dependencies]
superview-core = { path = "../superview-core" }

log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1.34"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
tempfile = "3.27.0"

[lints]
workspace = true
