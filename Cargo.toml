# Workspace of Superview (DEC-43). The Go program it replaced was removed in DEC-49 (last release with it: v0.2.9).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Canaill51/superview"
publish = false

# DEC-50: smaller binary (28.9 -> 18.4 MB measured). No `panic = "abort"`: app.rs turns a worker
# thread's panic into a displayed error with `catch_unwind`.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# No `unsafe` in the application, the core or the harness: they read files from anywhere and hand
# paths to ffmpeg, and only `unsafe` code could turn a malformed input into memory corruption. The
# Resolve plugin is the exception, since OpenFX, CUDA and OpenCL are C interfaces: superview-ofx
# lifts the ban in its lib.rs and in each test file that calls the drivers (DEC-65).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# DEC-65: the `ofx` crate on crates.io (0.3, 2019) predates stable Rust and Resolve; Gyroflow's
# plugin builds on this maintained fork, pinned to the same revision.
[patch.crates-io]
ofx = { git = "https://github.com/AdrianEddy/ofx-rs.git", rev = "0b152196fb47b0dd09c110881786d6a9e5e0d953" }
ofx_sys = { git = "https://github.com/AdrianEddy/ofx-rs.git", rev = "0b152196fb47b0dd09c110881786d6a9e5e0d953" }
