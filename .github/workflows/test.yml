name: Tests & Coverage

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  # Dispatched by merge-on-label.yml once it has merged a pull request. "Events
  # triggered by the GITHUB_TOKEN, with the exception of workflow_dispatch and
  # repository_dispatch, will not create a new workflow run" (docs.github.com,
  # "Triggering a workflow"), so the push it makes to master starts nothing on
  # its own, and from #73 to #77 master was not tested once (E-06).
  workflow_dispatch:

# A push to a pull request supersedes the run in progress on it. Only there: on
# master every commit keeps its own run, so a cancelled one cannot leave a
# commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Linux and Windows are two jobs, not one matrix: their steps no longer have
  # anything in common past setup-go (apt and -race on one, the pinned gyan.dev
  # archive on the other), and a matrix of two "if:"-guarded halves read worse.
  # The job names are the ones the matrix produced.
  #
  # Neither name is a required check of the master ruleset. The Windows suite
  # blocks a merge only because the gate below "needs" it: drop test-windows
  # from that list and a red Windows run no longer stops the auto-merge.
  test:
    name: Test Go 1.26.x on ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # setup-go caches the module and build caches itself, keyed on go.sum; a
    # second actions/cache step with the same paths used to sit here keyed on
    # the literal '1.26.x' (E-24). The key is per runner image, Go version and
    # go.sum, and whichever job finishes first saves it: the fmt job of
    # lint.yml, in seven seconds, was saving an empty one (7.5 KB on 801660d)
    # that every Linux job then "hit", so nothing was ever cached and Fyne's
    # cgo was compiled from scratch on every run. That job no longer caches.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache-dependency-path: go.sum

    - name: Install GUI build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev ffmpeg

    # ffmpeg is installed above, so a test that needs it must run rather than
    # skip. Without this the whole integration suite reports success having
    # encoded nothing, and only the coverage number hints at it.
    #
    # -race because the encode runs in a goroutine and reports to the UI
    # through fyne.Do; the Makefile has always said the suite is only
    # meaningful under the detector, and CI never ran it that way (E-11).
    # -count=1 because the restored build cache would otherwise let go test
    # answer "(cached)" for a package whose inputs did not change, and a run
    # that executed nothing is exactly what this workflow exists to prevent.
    #
    # No "go mod download" first: go test fetches what it needs, and the step
    # only repeated two seconds of work the cache had already done.
    - name: Run tests with coverage
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: go test -race -count=1 ./... -v -coverprofile=coverage.out -covermode=atomic

    # The released binary is built by "fyne package", which reads the
    # [Migrations] fyneDo key of FyneApp.toml and adds the migrated_fynedo
    # build tag. Under that tag Fyne's internal mutexes become no-ops and its
    # thread checks are disabled, so a widget touched off the UI thread is a
    # real data race there -- and invisible in the run above, which builds
    # without the tag. Only the GUI package changes under it.
    - name: Run the GUI tests as the release builds them
      run: go test -race -count=1 -tags migrated_fynedo ./cmd/superview

    - name: Display coverage summary
      run: go tool cover -func=coverage.out | tail -5

    # The gate job downloads this instead of running the suite a second time
    # for the same profile (E-24).
    - name: Upload the coverage profile for the gate
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-linux
        path: coverage.out
        if-no-files-found: error
        retention-days: 1

    # No Codecov upload. It failed on every run since it was added -- first
    # "Token required", then, once OIDC supplied a token, "Repository not
    # found": the repository was never activated on codecov.io, so not one
    # report ever arrived. The coverage gate below is the check that decides;
    # re-add the upload only after activating the repository there (E-18).

  test-windows:
    name: Test Go 1.26.x on windows-latest
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      # The same archive release.yml ships inside the Windows zip, pinned by
      # URL and checksum there -- keep the three values identical. The suite
      # used to run against whatever "choco install ffmpeg" fetched that day
      # (9.0.2, never the 8.1.1 that ships), with no version and no retry in
      # the critical path of a required check: run 38249403781 died on a
      # 504 from chocolatey (E-11).
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-essentials_build.7z
      FFMPEG_SHA256: 23ad8969fbe701d44e6e7e2b97c5fae4a71224fc33a2560a9034e5110d029d15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache-dependency-path: go.sum

    # Windows is an officially supported platform with a published build, and
    # for a long time every test that shells out to ffmpeg skipped here -- only
    # Linux got it installed. So the PowerShell file dialogs, the winget/scoop
    # binary discovery in findWindowsToolBinary and the whole encode path had
    # never run in CI on the platform half the users are on.
    #
    # Into RUNNER_TEMP, on the PATH, with the checksum verified first: the
    # suite then exercises the exact build a user receives.
    - name: Fetch and verify the pinned FFmpeg
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-bundle.7z'
        curl.exe -fsSL --retry 3 --retry-delay 5 -o $archive $env:FFMPEG_URL
        if ($LASTEXITCODE -ne 0) { throw "download of $env:FFMPEG_URL failed" }
        $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
        if ($hash -ne $env:FFMPEG_SHA256) {
          throw "checksum mismatch: expected $env:FFMPEG_SHA256, got $hash"
        }
        $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-bundle'
        7z x -y "-o$dest" $archive | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7z could not extract $archive" }
        $bin = Get-ChildItem -Path $dest -Recurse -Directory -Filter bin | Select-Object -First 1
        if (-not $bin) {
          Get-ChildItem -Path $dest -Recurse -Depth 2
          throw 'the pinned FFmpeg archive has no bin/ directory; its layout changed'
        }
        foreach ($tool in 'ffmpeg.exe', 'ffprobe.exe') {
          if (-not (Test-Path (Join-Path $bin.FullName $tool))) { throw "$tool is missing from $($bin.FullName)" }
        }
        Add-Content -Path $env:GITHUB_PATH -Value $bin.FullName
        Write-Host "FFmpeg on PATH from $($bin.FullName)"

    # Not decoration: a download that landed somewhere the PATH does not reach
    # would put the tests straight back to skipping. The version is asserted
    # too, so that an ffmpeg already on the runner image cannot answer in
    # place of the pinned one.
    - name: The pinned FFmpeg must be the one on the PATH
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (ffmpeg -version | Select-Object -First 1)
        Write-Host $version
        if ($version -notmatch '8\.1\.1') { throw "ffmpeg on PATH is not the pinned 8.1.1: $version" }
        ffprobe -version | Select-Object -First 1

    # No -race here. The detector needs a C toolchain, which on this image
    # means the mingw gcc that cgo already uses, and under it this run -- 7m38
    # of go test on 801660d, the longest job of the workflow by five minutes
    # -- would roughly double. The races the suite can catch are in
    # platform-independent Go, so the Linux job runs the detector and this
    # one proves the Windows-only code paths. -count=1 for the same reason as
    # on Linux.
    - name: Run tests with coverage
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: go test -count=1 ./... -v -coverprofile=coverage.out -covermode=atomic

    - name: Display coverage summary
      run: go tool cover -func=coverage.out | tail -5

  coverage-report:
    name: Coverage Report & Gate
    runs-on: ubuntu-latest
    # Both, not only the job whose profile it reads: this gate is the required
    # check that carries the two test jobs' verdicts (see above).
    needs: [test, test-windows]
    # always(), and the first step below, are what make that true. Without
    # them a failed test job makes this job *skipped*, and GitHub counts a
    # skipped required check as passing: #85, #86 and #87 merged with a red
    # Windows run, and before the split the matrix had the same hole, so a
    # red test had never blocked a merge since the merge workflow took over.
    if: always()
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Both test jobs passed
      env:
        LINUX: ${{ needs.test.result }}
        WINDOWS: ${{ needs.test-windows.result }}
      run: |
        echo "Linux tests: $LINUX -- Windows tests: $WINDOWS"
        if [ "$LINUX" != success ] || [ "$WINDOWS" != success ]; then
          echo "::error::A test job did not succeed (Linux: $LINUX, Windows: $WINDOWS); this gate is what blocks the merge."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Only "go tool cover" runs here, so neither the module cache nor the GUI
    # headers nor ffmpeg are needed: this job used to install all three and
    # run the whole suite a second time for a profile the test job had already
    # written (2m52 on 801660d, after waiting for both platforms).
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache: false

    - name: Download the coverage profile
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-linux

    - name: Check coverage threshold (50%)
      run: |
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        # Module-wide floor. Measured 54.6% on 2026-09-04
        # (was 30% while the real figure was already above it); raise as coverage grows.
        threshold=50.0
        if (( $(echo "$coverage < $threshold" | bc -l) )); then
          echo "❌ Coverage ${coverage}% is below threshold ${threshold}%"
          exit 1
        fi
        echo "✅ Coverage ${coverage}% meets threshold ${threshold}%"

    - name: Generate HTML coverage report
      run: go tool cover -html=coverage.out -o coverage.html

    # A fork's pull request runs with a read-only token, so the comment would
    # fail there and take the required check down with it (E-24). The comment
    # is a courtesy, never a verdict: the gate above is the verdict, so a
    # failure to post it does not fail the job either.
    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const coverage = require('child_process')
            .execSync('go tool cover -func=coverage.out | grep total')
            .toString()
            .trim();
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Coverage Report\n\`\`\`\n${coverage}\n\`\`\``
          });

  # No "needs:" on the test jobs: these two are required checks in their own
  # right, and a failing test job already blocks the merge through the gate
  # above. The dependency only serialised them behind the longest job of the
  # run (8m49 on 801660d), for nothing.
  native-build-matrix:
    name: Native Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-amd64
            runner: windows-latest
            expected_goos: windows
            expected_goarch: amd64
          - label: ubuntu-amd64
            runner: ubuntu-latest
            expected_goos: linux
            expected_goarch: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache-dependency-path: go.sum

    - name: Validate native runner architecture (Windows)
      if: matrix.expected_goos == 'windows'
      shell: pwsh
      run: |
        $goos = go env GOOS
        $goarch = go env GOARCH
        if ($goos -ne '${{ matrix.expected_goos }}') { throw "Expected GOOS=${{ matrix.expected_goos }}, got $goos" }
        if ($goarch -ne '${{ matrix.expected_goarch }}') { throw "Expected GOARCH=${{ matrix.expected_goarch }}, got $goarch" }
        Write-Host "Native runner verified: $goos/$goarch"

    - name: Build GUI (native, Windows)
      if: matrix.expected_goos == 'windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build | Out-Null
        go build -ldflags="-H=windowsgui" -o "build/superview-gui-${{ matrix.label }}.exe" ./cmd/superview

    - name: Verify build outputs (Windows)
      if: matrix.expected_goos == 'windows'
      shell: pwsh
      run: |
        if (-not (Test-Path "build/superview-gui-${{ matrix.label }}.exe")) { throw 'GUI artifact missing' }
        Write-Host "✅ Native build outputs verified"

    # No ffmpeg: this job builds, it does not test.
    - name: Install GUI build dependencies (Linux)
      if: matrix.expected_goos == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Validate native runner architecture (Linux)
      if: matrix.expected_goos == 'linux'
      run: |
        goos=$(go env GOOS)
        goarch=$(go env GOARCH)
        if [ "$goos" != "${{ matrix.expected_goos }}" ]; then echo "Expected GOOS=${{ matrix.expected_goos }}, got $goos"; exit 1; fi
        if [ "$goarch" != "${{ matrix.expected_goarch }}" ]; then echo "Expected GOARCH=${{ matrix.expected_goarch }}, got $goarch"; exit 1; fi
        echo "Native runner verified: $goos/$goarch"

    - name: Build GUI (native, Linux)
      if: matrix.expected_goos == 'linux'
      run: |
        mkdir -p build
        go build -o "build/superview-gui-${{ matrix.label }}" ./cmd/superview

    - name: Verify build outputs (Linux)
      if: matrix.expected_goos == 'linux'
      run: |
        test -f "build/superview-gui-${{ matrix.label }}" || { echo 'GUI artifact missing'; exit 1; }
        echo "✅ Native build outputs verified"
