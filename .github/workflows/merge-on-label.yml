name: Merge on label

# Picks the merge method so nobody has to.
#
# The rule it applies is the one written in docs/MERGING.md (summarised in AGENTS.md § Landing a change):
# squash, unless an open pull request is based on this branch, because squash
# rewrites the SHA and the one stacked above then loses its base. That rule was
# stated wrongly here for a long time -- "if your base is not master, you are
# stacked" -- which is false for the bottom pull request of a stack, and #59,
# #61 and #62 all had to be merged by hand against what the file said.
#
# A rule a human has to remember at the moment of clicking is a rule that gets
# it wrong eventually. This job answers the question from the API instead, and
# the answer is posted on the pull request so the choice stays auditable.
#
# Trigger: add the "merge" label. Nothing else starts it, so you still decide
# when a pull request lands -- only never how.

on:
  pull_request_target:
    types: [labeled]

# pull_request_target runs the workflow from the base branch with a writable
# token, which is only safe because this job never checks out, builds or runs
# a single line of the pull request's code. It talks to the API and nothing
# else. Do not add a checkout step here.
jobs:
  merge:
    name: Arm the merge
    if: github.event.label.name == 'merge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To dispatch the test and lint workflows on master once the merge has
      # landed -- see the last step.
      actions: write

    steps:
    - name: Pick the method and arm the merge
      id: arm
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        IS_DRAFT: ${{ github.event.pull_request.draft }}
        RULE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/master/docs/MERGING.md
      run: |
        set -euo pipefail

        if [ "$IS_DRAFT" = "true" ]; then
          gh pr comment "$PR" --repo "$REPO" --body \
            "🏷️ \`merge\` seen, but this pull request is a draft. Mark it ready for review and re-apply the label."
          echo "::notice::draft, nothing armed"
          exit 0
        fi

        # Is anything stacked on top of us?
        #
        # A pull request can only be based on a branch of this repository, so a
        # head branch living in a fork can carry nothing above it -- and asking
        # anyway would match an unrelated branch of ours that happens to share
        # the name.
        above=0
        if [ "$HEAD_REPO" = "$REPO" ]; then
          above="$(gh pr list --repo "$REPO" --base "$HEAD_REF" --state open --json number --jq 'length')"
        fi
        echo "above=$above" >> "$GITHUB_OUTPUT"

        if [ "$above" -eq 0 ]; then
          method=--squash
          name="Squash and merge"
          why="nothing is based on \`$HEAD_REF\`"
        else
          method=--merge
          name="Create a merge commit"
          why="$above open pull request(s) are based on \`$HEAD_REF\`, and squashing would rewrite the SHA they sit on"
        fi

        # mergeStateStatus is UNKNOWN while GitHub recomputes mergeability,
        # which is exactly the state a pull request is in right after a push.
        state=UNKNOWN
        for _ in 1 2 3 4 5 6; do
          state="$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)"
          if [ "$state" != "UNKNOWN" ]; then break; fi
          sleep 5
        done

        if [ "$state" = "DIRTY" ]; then
          gh pr comment "$PR" --repo "$REPO" --body \
            "🏷️ \`merge\` seen. Method would be **$name** ($why), but the branch conflicts with \`master\`. Resolve the conflict and re-apply the label."
          echo "::error::conflicts with base"
          exit 1
        fi

        # CLEAN means every required check already passed, so there is nothing
        # for auto-merge to wait on -- and GitHub refuses to arm it in that
        # state. UNKNOWN is not rare: GitHub computes mergeability lazily and
        # will hand back UNKNOWN for as long as it pleases, so the loop above
        # cannot be made to guarantee an answer. Arming is the safe reading of
        # it -- it waits rather than merges -- with a direct merge only if the
        # refusal turns out to be "there is nothing left to wait for".
        if [ "$state" = "CLEAN" ]; then
          gh pr merge "$PR" --repo "$REPO" "$method"
          verdict="merged now with **$name**"
        elif gh pr merge "$PR" --repo "$REPO" --auto "$method"; then
          verdict="**$name** armed; it lands as soon as the required checks pass"
        else
          state="$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)"
          if [ "$state" = "CLEAN" ]; then
            gh pr merge "$PR" --repo "$REPO" "$method"
            verdict="merged now with **$name**"
          else
            gh pr comment "$PR" --repo "$REPO" --body \
              "🏷️ \`merge\` seen. Method is **$name** ($why), but GitHub refused both arming and merging, with the pull request in state \`$state\`. Nothing was merged."
            echo "::error::could not arm or merge, state=$state"
            exit 1
          fi
        fi

        gh pr comment "$PR" --repo "$REPO" --body \
          "🏷️ \`merge\` seen — $verdict, because $why. ([docs/MERGING.md]($RULE_URL))"
        echo "::notice::$verdict"

    # An armed merge lands when the required checks pass, which on this
    # repository takes about ten minutes; the step timeout bounds the wait.
    # The two steps below both need the answer, so the wait is its own step:
    # the branch deletion skips forks and stacks, the re-run must not.
    - name: Wait for the merge
      id: landed
      timeout-minutes: 60
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        while :; do
          state="$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)"
          case "$state" in
            MERGED) break ;;
            CLOSED)
              echo "::notice::closed without merging"
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # Unarmed by hand, or never armed: nothing will merge it.
          if [ "$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" != "true" ]; then
            state="$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)"
            if [ "$state" != "MERGED" ]; then
              echo "::notice::auto-merge no longer armed"
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            break
          fi
          sleep 30
        done
        echo "merged=true" >> "$GITHUB_OUTPUT"
        echo "::notice::merged"

    # The repository deletes head branches on merge, but not when the merge is
    # made with this job's GITHUB_TOKEN: GitHub runs none of its automations on
    # what that token does. #76 was the first pull request this job merged that
    # Dependabot -- which cleans up after itself -- did not own, and its branch
    # stayed (M-06). So the job deletes the branch itself.
    #
    # Not when something is stacked on it. The repository setting retargets the
    # pull request above onto the base; deleting the branch through the API
    # closes it instead. That case is left to a human, and said so.
    - name: Delete the branch once merged
      if: steps.landed.outputs.merged == 'true' && steps.arm.outputs.above == '0' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
          echo "::notice::head is the default branch, never deleted"
          exit 0
        fi

        # Checked again after the merge: a pull request can be based on this
        # branch between the label and the merge.
        above="$(gh pr list --repo "$REPO" --base "$HEAD_REF" --state open --json number --jq 'length')"
        if [ "$above" -ne 0 ]; then
          gh pr comment "$PR" --repo "$REPO" --body \
            "🧹 Branch \`$HEAD_REF\` kept: $above open pull request(s) are now based on it, and deleting it would close them. Retarget them onto \`$DEFAULT_BRANCH\`, then delete it."
          exit 0
        fi

        # Already gone is success: Dependabot deletes its own branches, and the
        # repository setting may yet do its job.
        if gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" 2>"$RUNNER_TEMP/err.txt"; then
          echo "::notice::deleted $HEAD_REF"
        elif grep -q "Reference does not exist" "$RUNNER_TEMP/err.txt"; then
          echo "::notice::$HEAD_REF was already deleted"
        else
          cat "$RUNNER_TEMP/err.txt" >&2
          exit 1
        fi

    # The other half of what the token does not trigger. "Events triggered by
    # the GITHUB_TOKEN, with the exception of workflow_dispatch and
    # repository_dispatch, will not create a new workflow run" (docs.github.com,
    # "Triggering a workflow"): the merge commit this job puts on master starts
    # neither test.yml nor lint.yml, and from #73 to #77 master was not tested
    # once (E-06). L-100 had said so -- "neither branch deletion nor workflow"
    # -- and only the first half was acted on.
    #
    # Hence the exception, used on purpose: both workflows accept
    # workflow_dispatch, and this step dispatches them on the base branch, so
    # the merged commit is tested as a push of it would have been.
    #
    # Not the two other ways out. A strict ruleset ("require branches to be up
    # to date before merging") would test the merged result on the pull
    # request instead, but it refuses every pull request that is not on top of
    # master -- each member of a stack, each Dependabot bump queued behind
    # another -- until someone rebases it by hand, which is the manual step the
    # label exists to remove. A GitHub App or personal token in place of
    # GITHUB_TOKEN would trigger everything natively, at the price of a
    # long-lived credential in the repository's secrets for a job that merges
    # code.
    #
    # Best effort: a dispatch that fails is logged, never fatal. The merge has
    # happened, and failing here would only paint a landed pull request red.
    - name: Run the checks on the base branch
      if: steps.landed.outputs.merged == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -uo pipefail

        # The push trigger of both workflows lists the default branch and its
        # aliases only, so a merge into a feature branch would have started
        # nothing either.
        if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
          echo "::notice::merged into $BASE_REF, not $DEFAULT_BRANCH; nothing to re-run"
          exit 0
        fi

        for workflow in test.yml lint.yml; do
          if gh workflow run "$workflow" --repo "$REPO" --ref "$BASE_REF"; then
            echo "::notice::dispatched $workflow on $BASE_REF"
          else
            echo "::warning::could not dispatch $workflow on $BASE_REF; run 'gh workflow run $workflow --ref $BASE_REF' by hand"
          fi
        done
