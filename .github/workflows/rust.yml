name: Rust

# Rust port in progress (DEC-43). These three jobs are required checks of the `master`
# ruleset (added 2026-10-19), next to the Go ones.
# No path filter, like the other workflows: a required check that never starts
# blocks the merge.

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The runner has rustup; rust/rust-toolchain.toml selects the pinned version.
    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: rust

    # libfontconfig1-dev: Slint's text layout (yeslogic-fontconfig-sys) is built against it
    # and the runner image does not have it. The window's other libraries are loaded at run time.
    - name: Install FFmpeg and the window's build libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg libfontconfig1-dev

    # The same recipe as scripts/checks/rust.sh, one step at a time so that CI says
    # which one fails.
    - name: Format
      working-directory: rust
      run: cargo fmt --all --check

    - name: Clippy
      working-directory: rust
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    # Without SUPERVIEW_REQUIRE_FFMPEG=1 the tests that need ffmpeg would skip
    # silently: a green suite could have encoded nothing.
    - name: Test
      working-directory: rust
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: cargo test --workspace --locked

    # The window trial (phase 3b): the release binary starts and stays open, bare and
    # then packed in an AppImage with the release's script. Slint's software
    # renderer needs no GL; xvfb is the display. timeout ends the window after 10 s with
    # code 124, so it was still open; any other code means it exited by itself.
    - name: Install the window trial tooling
      run: |
        set -euo pipefail
        # libxkbcommon-x11-0: winit loads it at run time on X11; the runner image has not got it.
        sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0
        curl -fsSL -o "${RUNNER_TEMP}/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  ${RUNNER_TEMP}/appimagetool" | sha256sum -c -
        chmod +x "${RUNNER_TEMP}/appimagetool"

    - name: Build the release binary
      working-directory: rust
      run: cargo build --release --locked -p superview-app

    - name: The build marker must be in the binary
      run: |
        set -euo pipefail
        # Not guaranteed to survive the linker: the release greps this marker in the built file.
        if ! grep -aq "SUPERVIEW-BUILD version=dev" rust/target/release/superview; then
          echo "::error::the SUPERVIEW-BUILD marker is missing from the release binary"
          exit 1
        fi

    - name: The window must stay open
      run: |
        set -euo pipefail
        set +e
        xvfb-run -a timeout 10 rust/target/release/superview
        code=$?
        set -e
        echo "exit code: ${code}"
        if [ "$code" -ne 124 ]; then
          echo "::error::the window did not stay open (exit code ${code}, expected 124)"
          exit 1
        fi
        # The application ID is set once the window exists; a refusal is only logged.
        log="${XDG_CACHE_HOME:-$HOME/.cache}/superview/superview.log"
        if grep -q "could not set the application ID" "$log"; then
          echo "::error::the application ID was refused"
          grep "could not set the application ID" "$log"
          exit 1
        fi

    # build_appimage.sh takes the binary, the tools and the output (DEC-47). The runner's own
    # ffmpeg stands in for the bundled tools: only the packaging is on trial.
    #
    # The script copies libxkbcommon, libxkbcommon-x11 and libxcb-xkb into the image, so they must be on the
    # runner while it runs. The launch then happens without libxkbcommon-x11 (the bare window
    # test above needed it and is over): the package is removed and its absence asserted, and
    # check_appimage_libs.sh reads the loader's log (LD_DEBUG=libs) to show that all three libraries
    # came from the image, although the system keeps its own libxkbcommon. This is what tests the embedding on every pull request.
    - name: Pack and launch an AppImage
      run: |
        set -euo pipefail
        work="${RUNNER_TEMP}/trial"
        mkdir -p "${work}/tools"
        cp "$(command -v ffmpeg)" "$(command -v ffprobe)" "${work}/tools/"
        APPIMAGETOOL="${RUNNER_TEMP}/appimagetool" sh packaging/linux/build_appimage.sh \
          rust/target/release/superview "${work}/tools" "${work}/trial.AppImage"
        sudo dpkg --remove --force-depends libxkbcommon-x11-0
        if dpkg -s libxkbcommon-x11-0 > /dev/null 2>&1 || [ -e /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 ]; then
          echo "::error::libxkbcommon-x11 is still on the system, so the launch below would prove nothing"
          exit 1
        fi
        echo "libxkbcommon-x11-0: absent from the system"
        export APPIMAGE_EXTRACT_AND_RUN=1
        set +e
        xvfb-run -a timeout 10 "${work}/trial.AppImage"
        code=$?
        set -e
        echo "exit code: ${code}"
        if [ "$code" -ne 124 ]; then
          echo "::error::the AppImage did not stay open (exit code ${code}, expected 124)"
          exit 1
        fi
        sh packaging/linux/check_appimage_libs.sh "${work}/trial.AppImage" 10

  # Go/Rust cross-check (PR 5c): the same clip converted by Go's PerformEncoding and by the
  # Rust test bench, with the same encoder and rate; the decoded frames and the ffprobe
  # summaries must agree. Go has no windowless executable, hence a Go test that runs the
  # bench. Ubuntu only. Not a required check; it goes away with Go (phase 8).
  cross-check:
    name: Go and Rust cross-check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        # No cache saved: this job builds little Go and a shared key would be written
        # by whichever job ends first (L-108).
        cache: false

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: rust

    # libfontconfig1-dev: the workspace build libraries, as in rust-linux.
    - name: Install FFmpeg and the build libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg libfontconfig1-dev

    - name: Build the bench
      working-directory: rust
      run: cargo build -p superview-harness --locked

    # SUPERVIEW_REQUIRE_RUST_HARNESS makes a missing bench a failure, not a skip. The grep
    # then insists both tests really passed, so a renamed test cannot leave the job green
    # having run nothing.
    - name: Cross-check
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
        SUPERVIEW_REQUIRE_RUST_HARNESS: '1'
      run: |
        set -euo pipefail
        export SUPERVIEW_RUST_HARNESS="$GITHUB_WORKSPACE/rust/target/debug/superview-harness"
        go test ./internal/common -run 'TestCrossCheck' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/crosscheck.log"
        for name in TestCrossCheck_GoAndRustProduceTheSameVideo TestCrossCheck_UsableEncodersAreTheSame; do
          if ! grep -q -- "--- PASS: ${name}" "$RUNNER_TEMP/crosscheck.log"; then
            echo "::error::${name} did not pass (renamed, skipped or missing)"
            exit 1
          fi
        done

  rust-windows:
    name: Rust on windows-latest
    runs-on: windows-latest

    env:
      # The same values as test.yml and release.yml: the pinned FFmpeg archive
      # (NVENC floor 570.0, DEC-04). The three files must stay identical.
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-essentials_build.7z
      FFMPEG_SHA256: 23ad8969fbe701d44e6e7e2b97c5fae4a71224fc33a2560a9034e5110d029d15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: rust

    - name: Fetch and verify the pinned FFmpeg
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-bundle.7z'
        curl.exe -fsSL --retry 3 --retry-delay 5 -o $archive $env:FFMPEG_URL
        if ($LASTEXITCODE -ne 0) { throw "download of $env:FFMPEG_URL failed" }
        $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
        if ($hash -ne $env:FFMPEG_SHA256) {
          throw "checksum mismatch: expected $env:FFMPEG_SHA256, got $hash"
        }
        $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-bundle'
        7z x -y "-o$dest" $archive | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7z could not extract $archive" }
        $bin = Get-ChildItem -Path $dest -Recurse -Directory -Filter bin | Select-Object -First 1
        if (-not $bin) {
          Get-ChildItem -Path $dest -Recurse -Depth 2
          throw 'the pinned FFmpeg archive has no bin/ directory; its layout changed'
        }
        foreach ($tool in 'ffmpeg.exe', 'ffprobe.exe') {
          if (-not (Test-Path (Join-Path $bin.FullName $tool))) { throw "$tool is missing from $($bin.FullName)" }
        }
        Add-Content -Path $env:GITHUB_PATH -Value $bin.FullName
        Write-Host "FFmpeg on PATH from $($bin.FullName)"

    # The version is asserted: an ffmpeg already on the runner image must not
    # answer in place of the pinned one.
    - name: The pinned FFmpeg must be the one on the PATH
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Whole output first, then its first line: cutting the pipe early makes the
        # tool exit non-zero (L-115).
        $version = (ffmpeg -version)[0]
        Write-Host $version
        if ($version -notmatch '8\.1\.1') { throw "ffmpeg on PATH is not the pinned 8.1.1: $version" }
        (ffprobe -version)[0]

    - name: Format
      working-directory: rust
      run: cargo fmt --all --check

    - name: Clippy
      working-directory: rust
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Test
      working-directory: rust
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: cargo test --workspace --locked

    # The window trial (phase 3b) on Windows: the release binary starts and is still
    # running after 10 s. There is no installer in this trial.
    - name: Build the release binary
      working-directory: rust
      run: cargo build --release --locked -p superview-app

    - name: The build marker must be in the binary
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $bytes = [System.IO.File]::ReadAllBytes("rust\target\release\superview.exe")
        $text = [System.Text.Encoding]::Latin1.GetString($bytes)
        if (-not $text.Contains("SUPERVIEW-BUILD version=dev")) {
          Write-Host "::error::the SUPERVIEW-BUILD marker is missing from the release binary"
          exit 1
        }

    - name: The window must stay open
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $proc = Start-Process -FilePath rust\target\release\superview.exe -PassThru
        Start-Sleep -Seconds 10
        if ($proc.HasExited) { throw "the window exited by itself with code $($proc.ExitCode)" }
        Write-Host "still running after 10 s (pid $($proc.Id))"
        Stop-Process -Id $proc.Id -Force
