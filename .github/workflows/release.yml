name: Release

on:
  push:
    tags:
      - 'v*'
      - 'RC-*'
  # Three ways in, and they all end at an annotated tag and a published
  # release whose notes GitHub generates from the pull requests merged since
  # the previous tag.
  #
  #   Dispatch with a version -- the button, and the whole of it. Nothing to
  #   prepare, nothing to write: the run builds both platforms, and only once
  #   they have passed does it tag and publish.
  #
  #   Dispatch with no version -- a dry run. Builds both platforms, tags
  #   nothing, publishes nothing. This is how a change to this file gets tried
  #   without spending a version number, and it is the reason v0.1.5 and
  #   v0.1.6 could break unnoticed for two months when it did not exist.
  #
  #   Pushing a tag by hand -- the escape hatch, and the way to write notes
  #   yourself: an annotated tag's message leads the release body, ahead of the
  #   generated list. The release stops at a draft.
  #
  # Notes used to live in RELEASE_NOTES.md, which the run copied into the tag.
  # That file had to be rewritten before every release, was easy to forget --
  # so the run had to grow a check that its first line named the version being
  # released -- and it sat in master permanently holding the *previous*
  # release's text, which reads exactly like something stale. The list GitHub
  # generates from merged pull requests says what changed without any of that.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.3. Leave empty for a dry run that publishes nothing.'
        required: false
        default: ''
      draft:
        description: 'Stop at a draft instead of publishing'
        type: boolean
        default: false
      prerelease:
        description: 'Release candidate: tags RC-x.y.z instead of vx.y.z'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Everything the rest of the run needs to know is decided once, here.
  #
  # Deciding it per job is how the version came to be derived by stripping a
  # leading "v" in two separate places, which worked for a v-tag and for no
  # other ref the triggers admit -- the first manual dispatch died on
  # "--app-version master" in both build jobs (#40).
  prepare:
    name: Work out what this run is
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      label: ${{ steps.plan.outputs.label }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      draft: ${{ steps.plan.outputs.draft }}
      prerelease: ${{ steps.plan.outputs.prerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Plan the run
      id: plan
      # Inputs reach the script through the environment, never interpolated
      # into it: a ${{ }} inside a run: block is executed by the shell.
      env:
        EVENT: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail

        if [ "$EVENT" = "push" ]; then
          tag="${GITHUB_REF_NAME}"
          release=true
          # No checkbox on this path, so it keeps the cautious default it has
          # always had: a draft that someone has to look at and publish.
          draft=true
          case "$tag" in RC-*) prerelease=true ;; *) prerelease=false ;; esac
        elif [ -z "$INPUT_VERSION" ]; then
          # A dry run labels its archives with the branch, and branches here are
          # named fix/..., feat/..., docs/... -- a slash in the middle of a file
          # name is a directory that does not exist, which is how the first dry
          # run off master died on "mv: cannot move ... No such file or
          # directory". Nothing downstream needs the exact branch name.
          {
            echo "tag="
            echo "label=${GITHUB_REF_NAME//\//-}"
            echo "version=0.0.0"
            echo "release=false"
            echo "draft=false"
            echo "prerelease=false"
          } >> "$GITHUB_OUTPUT"
          echo "No version given: dry run. Both platforms build; nothing is tagged or published."
          exit 0
        else
          if ! printf '%s' "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be x.y.z, got '${INPUT_VERSION}'"
            exit 1
          fi
          draft="$INPUT_DRAFT"
          prerelease="$INPUT_PRERELEASE"
          if [ "$prerelease" = "true" ]; then
            tag="RC-${INPUT_VERSION}"
          else
            tag="v${INPUT_VERSION}"
          fi
          release=true
        fi

        # fyne package accepts x.y.z and nothing else.
        if [[ "$tag" =~ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
          version="${BASH_REMATCH[1]}"
        else
          echo "::error::tag '${tag}' contains no x.y.z version, so the binary cannot be stamped"
          exit 1
        fi

        if [ "$EVENT" != "push" ]; then
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists -- pick another version, or delete the tag if it was a mistake"
            exit 1
          fi
        fi

        {
          echo "tag=${tag}"
          echo "label=${tag}"
          echo "version=${version}"
          echo "release=${release}"
          echo "draft=${draft}"
          echo "prerelease=${prerelease}"
        } >> "$GITHUB_OUTPUT"
        echo "tag=${tag} version=${version} release=${release} draft=${draft} prerelease=${prerelease}"

  test:
    name: Run Tests Before Release
    needs: prepare
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    # ffmpeg matters here, and not only to run more tests. Without it every
    # integration test used to skip, and module coverage measured 51.4%
    # instead of 59.3% -- a gate of 50% away from failing a release for a
    # reason that had nothing to do with the release, and, worse, passing one
    # on a suite that had encoded nothing. SUPERVIEW_REQUIRE_FFMPEG below now
    # turns that silence into a failure, so the coverage number no longer
    # carries the news on its own.
    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev ffmpeg

    - name: Run tests
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: go test ./... -v

    - name: Run coverage check
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: |
        go test ./... -coverprofile=coverage.out
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        if (( $(echo "$coverage < 50" | bc -l) )); then
          echo "❌ Coverage ${coverage}% below 50% gate"
          exit 1
        fi
        echo "✅ Coverage ${coverage}% passes gate"

  build-gui-windows:
    name: Build GUI (Windows)
    needs: [prepare, test]
    runs-on: windows-latest

    env:
      # The FFmpeg shipped inside the Windows archive.
      #
      # 8.1.1 rather than 8.1.2, and the reason is the whole point of bundling.
      # The NVENC driver floor is fixed when FFmpeg is compiled, by the
      # nv-codec-headers it is built against -- not by the FFmpeg version. Between
      # gyan.dev's 8.1.1 and 8.1.2 that floor went from 570.0 to 610.00, and the
      # NVIDIA RTX Enterprise driver branch tops out at 597.06: on a professional
      # card, 8.1.2 can never use NVENC, however current the driver is. That is
      # the bug report this bundling answers (ANALYSE.md U-03).
      #
      # So the property being pinned is the floor, not the version. The step below
      # reads it back out of the downloaded binary and fails if it is not 570.0 --
      # bumping this pin to a build compiled against newer headers is exactly the
      # mistake that would re-break the machines this protects.
      #
      # "essentials" carries libx264, libx265, nvenc, amf and qsv, which is all
      # Superview targets, and is a third of the size of "full".
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-essentials_build.7z
      FFMPEG_SHA256: 23ad8969fbe701d44e6e7e2b97c5fae4a71224fc33a2560a9034e5110d029d15
      FFMPEG_DRIVER_FLOOR: '570.0'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    # The packaging tool is pinned, like every action in this repository is
    # pinned by SHA. Fetching @latest at release time meant an upstream change
    # to the tool's output name or location could break a release with no change
    # on our side -- which is the exact shape of the failure that kept v0.1.5
    # and v0.1.6 from ever being published.
    #
    # The version is passed here rather than read from FyneApp.toml: a number
    # committed in a file drifts from the tag the moment master moves past a
    # release, and the binary would then claim to be something it is not.
    - name: Build GUI (native arch)
      shell: bash
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        set -euo pipefail
        mkdir -p build
        ARCH="$(go env GOARCH)"
        go run fyne.io/tools/cmd/fyne@v1.7.2 package -os windows -icon Icon.png -name "superview-gui-windows-${ARCH}" --app-version "${VERSION}"
        mv "superview-gui-windows-${ARCH}.exe" "build/superview-gui-windows-${ARCH}.exe"

    # Same check as the Linux job, and for the same reason -- see the comment
    # there. The binary is loose here, so there is nothing to unpack first.
    - name: The packaged binary must not claim to be modified
      shell: bash
      run: |
        set -euo pipefail
        ARCH="$(go env GOARCH)"
        bin="build/superview-gui-windows-${ARCH}.exe"
        go version -m "$bin" | grep -aE 'vcs\.(revision|modified)' || true
        if go version -m "$bin" | grep -qa 'vcs.modified=true'; then
          echo "::error::the packaged binary is stamped vcs.modified=true, so it will announce itself as ', modified'. Something left an unignored file in the working tree while it was built."
          git status --porcelain
          exit 1
        fi

    # Downloaded into RUNNER_TEMP, never into the checkout: an unignored file in
    # the working tree during the build is what stamps the binary vcs.modified,
    # and the step above exists because that has already shipped once.
    - name: Fetch and verify the pinned FFmpeg
      shell: bash
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/ffmpeg-bundle.7z"
        curl -fsSL -o "$archive" "$FFMPEG_URL"
        echo "${FFMPEG_SHA256}  ${archive}" | sha256sum -c -

        7z x -y -o"${RUNNER_TEMP}/ffmpeg-bundle" "$archive" > /dev/null
        bin_dir="$(find "${RUNNER_TEMP}/ffmpeg-bundle" -type d -name bin | head -n 1)"
        if [ -z "$bin_dir" ]; then
          echo "::error::the pinned FFmpeg archive has no bin/ directory; its layout changed"
          find "${RUNNER_TEMP}/ffmpeg-bundle" -maxdepth 2
          exit 1
        fi
        cp "$bin_dir/ffmpeg.exe" "$bin_dir/ffprobe.exe" build/

    - name: The bundled FFmpeg must demand the driver floor we measured
      shell: bash
      run: |
        set -euo pipefail
        source .github/scripts/nvenc-driver-floor.sh
        assert_driver_floor "$FFMPEG_DRIVER_FLOOR" build/ffmpeg.exe build/ffprobe.exe

    - name: Create archives
      shell: pwsh
      env:
        LABEL: ${{ needs.prepare.outputs.label }}
      run: |
        $arch = go env GOARCH
        switch ($arch) {
          "amd64" { $archLabel = "x86_64" }
          "386" { $archLabel = "i386" }
          "arm64" { $archLabel = "aarch64" }
          default { $archLabel = $arch }
        }
        # Everything goes in one folder inside the zip rather than loose at its
        # root: the archive now carries four files, and extracting those into
        # whatever directory the user happened to open would scatter an
        # ffmpeg.exe across their Downloads.
        #
        # ffmpeg.exe and ffprobe.exe sit beside the application, which is the
        # first place resolveToolBinary looks.
        $stage = "build/superview-$env:LABEL-windows-$archLabel"
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        Copy-Item "build/superview-gui-windows-$arch.exe" $stage
        Copy-Item "build/ffmpeg.exe" $stage
        Copy-Item "build/ffprobe.exe" $stage
        Copy-Item "THIRD_PARTY_NOTICES.md" $stage
        Compress-Archive -Path $stage -DestinationPath "superview-gui-$env:LABEL-windows-$archLabel.zip" -Force

    - name: Upload GUI artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gui-windows-artifacts
        path: superview-gui-${{ needs.prepare.outputs.label }}-windows-*.zip
        # Uploading nothing is not success: without this the release job would
        # publish an empty draft.
        if-no-files-found: error

  build-gui-linux:
    name: Build GUI (Linux)
    needs: [prepare, test]
    runs-on: ubuntu-latest

    env:
      # The FFmpeg shipped inside the Linux archive. Same reasoning as the
      # Windows job: what is pinned is the NVENC driver floor, 570.0, and the
      # step below reads it back out of the binary.
      #
      # BtbN rather than gyan.dev, who builds for Windows only. The tag is a
      # month-end autobuild on purpose: BtbN prunes mid-month builds -- the pin
      # in the fork this idea came from is already a 404 -- but keeps the last
      # build of each month, and the October 2024 one still answers today.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-8.1.tar.xz
      FFMPEG_SHA256: c733b4b2951e5957e15505f788b2c65a7a41b6da4b289e295852cc38079b4d2b
      FFMPEG_DRIVER_FLOOR: '570.0'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    # "fyne package" writes its archive in the working directory, not in a
    # build/ subdirectory. The previous version created build/, packaged, then
    # looked for the result inside build/ -- which is what killed v0.1.5 and
    # v0.1.6 with "mv: cannot stat 'superview-gui-linux-amd64'".
    #
    # The check below is the point of this step as much as the packaging is: if
    # the tool ever changes its output name or location again, this says so, in
    # this step, with a directory listing -- instead of failing two steps later
    # on a message that names the wrong thing.
    - name: Build GUI (native arch)
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        set -euo pipefail
        ARCH="$(go env GOARCH)"
        go run fyne.io/tools/cmd/fyne@v1.7.2 package -os linux -icon Icon.png -name "superview-gui-linux-${ARCH}" --app-version "${VERSION}" .
        if [ ! -f "superview-gui-linux-${ARCH}.tar.xz" ]; then
          echo "::error::fyne package did not produce superview-gui-linux-${ARCH}.tar.xz"
          echo "Working directory contains:"
          ls -lah
          exit 1
        fi

    # The version stamp is this project's answer to "which build produced
    # this?", so a release that gets it wrong is worse than one that says
    # nothing. v0.2.3 shipped announcing "0.2.3 (9c1a8c5, modified)" from a
    # pristine checkout, and nothing in the run noticed. This asserts the
    # outcome rather than the cause: whatever leaves a file in the tree during
    # the build, the binary is what gets stamped, so the binary is what gets
    # checked.
    - name: The packaged binary must not claim to be modified
      run: |
        set -euo pipefail
        ARCH="$(go env GOARCH)"
        rm -rf /tmp/verify && mkdir -p /tmp/verify
        tar -xJf "superview-gui-linux-${ARCH}.tar.xz" -C /tmp/verify
        bin="$(find /tmp/verify -type f -path '*/bin/*' | head -n 1)"
        echo "Inspecting ${bin}"
        go version -m "$bin" | grep -aE 'vcs\.(revision|modified)' || true
        if go version -m "$bin" | grep -qa 'vcs.modified=true'; then
          echo "::error::the packaged binary is stamped vcs.modified=true, so it will announce itself as ', modified'. Something left an unignored file in the working tree while it was built."
          git status --porcelain
          exit 1
        fi

    # Into RUNNER_TEMP, never the checkout: an unignored file in the working
    # tree stamps the binary vcs.modified, which the step above exists to catch.
    - name: Fetch and verify the pinned FFmpeg
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/ffmpeg-bundle.tar.xz"
        curl -fsSL -o "$archive" "$FFMPEG_URL"
        echo "${FFMPEG_SHA256}  ${archive}" | sha256sum -c -

        mkdir -p "${RUNNER_TEMP}/ffmpeg-bundle"
        tar -xJf "$archive" -C "${RUNNER_TEMP}/ffmpeg-bundle"
        bin_dir="$(find "${RUNNER_TEMP}/ffmpeg-bundle" -type d -name bin | head -n 1)"
        if [ -z "$bin_dir" ]; then
          echo "::error::the pinned FFmpeg archive has no bin/ directory; its layout changed"
          find "${RUNNER_TEMP}/ffmpeg-bundle" -maxdepth 2
          exit 1
        fi
        mkdir -p "${RUNNER_TEMP}/ffbin"
        cp "$bin_dir/ffmpeg" "$bin_dir/ffprobe" "${RUNNER_TEMP}/ffbin/"
        chmod 0755 "${RUNNER_TEMP}/ffbin/ffmpeg" "${RUNNER_TEMP}/ffbin/ffprobe"

    - name: The bundled FFmpeg must demand the driver floor we measured
      run: |
        set -euo pipefail
        source .github/scripts/nvenc-driver-floor.sh
        assert_driver_floor "$FFMPEG_DRIVER_FLOOR" "${RUNNER_TEMP}/ffbin/ffmpeg" "${RUNNER_TEMP}/ffbin/ffprobe"

    # The tools go under lib/superview, not next to the app.
    #
    # The app installs into $PREFIX/bin, so an "ffmpeg" beside it would land in
    # /usr/local/bin and shadow the system's for every program on the machine.
    # A sibling lib/superview directory is private to us, and the app finds it
    # both installed ($PREFIX/lib/superview) and straight out of the unpacked
    # tarball, because the path it looks up is relative to its own binary.
    #
    # fyne's Makefile installs three named files, so the two new ones have to be
    # added to it. Keying the insertion on the line that installs the app means
    # a change to that Makefile's shape fails here rather than silently
    # producing a package that installs no FFmpeg.
    - name: Bundle FFmpeg into the Linux package
      run: |
        set -euo pipefail
        arch="$(go env GOARCH)"
        tarball="superview-gui-linux-${arch}.tar.xz"

        work="${RUNNER_TEMP}/package"
        rm -rf "$work" && mkdir -p "$work"
        tar -xJf "$tarball" -C "$work"

        root="$(find "$work" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
        if [ ! -f "$root/Makefile" ]; then
          echo "::error::the fyne package has no Makefile at its root; its layout changed"
          find "$work" -maxdepth 3
          exit 1
        fi

        install -Dm0755 "${RUNNER_TEMP}/ffbin/ffmpeg"  "$root/usr/local/lib/superview/ffmpeg"
        install -Dm0755 "${RUNNER_TEMP}/ffbin/ffprobe" "$root/usr/local/lib/superview/ffprobe"

        # Repair fyne 1.7.2's icon line while we are here. It sets
        # Icon := "com.canaill51.superview" but ships the file as
        # com.canaill51.superview.png, so "make install" fails on its last line
        # with "install: No such file or directory" -- after having installed
        # the binary, which is why nobody noticed. Every Linux archive this
        # project has published has been broken that way.
        #
        # Taking the name from the file that is actually there rather than
        # appending ".png": if fyne fixes this, the rewrite becomes a no-op
        # instead of producing "…png.png".
        icon_file="$(find "$root/usr/local/share/pixmaps" -maxdepth 1 -type f -printf '%f\n' | head -n 1)"
        if [ -z "$icon_file" ]; then
          echo "::error::the fyne package ships no icon under usr/local/share/pixmaps"
          find "$root/usr/local/share" -maxdepth 3
          exit 1
        fi
        sed -i "s|^Icon := .*|Icon := \"${icon_file}\"|" "$root/Makefile"

        awk '
          { print }
          /install -Dm00755 usr\/local\/bin\/\$\(Exec\) \$\(DESTDIR\)\$\(PREFIX\)\/bin\/\$\(Exec\)/ {
              print "\tinstall -Dm00755 usr/local/lib/superview/ffmpeg $(DESTDIR)$(PREFIX)/lib/superview/ffmpeg"
              print "\tinstall -Dm00755 usr/local/lib/superview/ffprobe $(DESTDIR)$(PREFIX)/lib/superview/ffprobe"
              seen_install = 1
          }
          /install -Dm00755 usr\/local\/bin\/\$\(Exec\) \$\(DESTDIR\)\$\(HOME\)\/\.local\/bin\/\$\(Exec\)/ {
              print "\tinstall -Dm00755 usr/local/lib/superview/ffmpeg $(DESTDIR)$(HOME)/.local/lib/superview/ffmpeg"
              print "\tinstall -Dm00755 usr/local/lib/superview/ffprobe $(DESTDIR)$(HOME)/.local/lib/superview/ffprobe"
              seen_user_install = 1
          }
          /-rm \$\(DESTDIR\)\$\(PREFIX\)\/bin\/\$\(Exec\)/ {
              print "\t-rm -r $(DESTDIR)$(PREFIX)/lib/superview"
              seen_uninstall = 1
          }
          /-rm \$\(DESTDIR\)\$\(HOME\)\/\.local\/bin\/\$\(Exec\)/ {
              print "\t-rm -r $(DESTDIR)$(HOME)/.local/lib/superview"
              seen_user_uninstall = 1
          }
          END {
              if (!seen_install || !seen_user_install || !seen_uninstall || !seen_user_uninstall) {
                  print "::error::fyne'"'"'s Makefile no longer has the lines this patch keys on (install=" seen_install \
                        " user-install=" seen_user_install " uninstall=" seen_uninstall \
                        " user-uninstall=" seen_user_uninstall "); the package would install no FFmpeg" > "/dev/stderr"
                  exit 1
              }
          }
        ' "$root/Makefile" > "${RUNNER_TEMP}/Makefile.patched"
        mv "${RUNNER_TEMP}/Makefile.patched" "$root/Makefile"

        cp THIRD_PARTY_NOTICES.md "$root/"
        rm -f "$tarball"
        tar -cJf "$tarball" -C "$work" "$(basename "$root")"

    # Asserting the outcome rather than the patch: install into a throwaway
    # DESTDIR and check the files land where the app will look for them.
    - name: The package must actually install its FFmpeg
      run: |
        set -euo pipefail
        arch="$(go env GOARCH)"
        dest="${RUNNER_TEMP}/verify-install"
        work="${RUNNER_TEMP}/verify-package"
        rm -rf "$dest" "$work" && mkdir -p "$dest" "$work"

        tar -xJf "superview-gui-linux-${arch}.tar.xz" -C "$work"
        root="$(find "$work" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
        make -C "$root" install DESTDIR="$dest" PREFIX=/usr

        for tool in ffmpeg ffprobe; do
          if [ ! -x "$dest/usr/lib/superview/$tool" ]; then
            echo "::error::make install did not put $tool where the app looks for it"
            find "$dest" -type f
            exit 1
          fi
        done
        # And the app itself must still be installed beside it, one level up.
        if [ ! -x "$dest/usr/bin/superview" ]; then
          echo "::error::make install no longer installs the application binary"
          find "$dest" -type f
          exit 1
        fi
        # The icon too: "make install" used to fail on it, and the whole point
        # of running the install here is that such a failure is now visible.
        if ! find "$dest/usr/share/pixmaps" -type f | grep -q .; then
          echo "::error::make install did not install the application icon"
          find "$dest" -type f
          exit 1
        fi
        echo "installed layout:"
        find "$dest" -type f | sort

    - name: Name the archive for the release
      env:
        LABEL: ${{ needs.prepare.outputs.label }}
      run: |
        set -euo pipefail
        arch="$(go env GOARCH)"
        case "$arch" in
          amd64) archLabel="x86_64" ;;
          386) archLabel="i386" ;;
          arm64) archLabel="aarch64" ;;
          *) archLabel="$arch" ;;
        esac
        # Keep the .tar.xz fyne produces rather than repacking it as .tar.gz:
        # it already carries the binary, the .desktop entry and the icon, which
        # is what makes the archive installable rather than just a loose binary.
        mv "superview-gui-linux-${arch}.tar.xz" "superview-gui-${LABEL}-linux-${archLabel}.tar.xz"
        ls -lah "superview-gui-${LABEL}-linux-${archLabel}.tar.xz"

    - name: Upload GUI artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gui-linux-artifacts
        path: superview-gui-${{ needs.prepare.outputs.label }}-linux-*.tar.xz
        if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [prepare, build-gui-windows, build-gui-linux]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.release == 'true'

    steps:
    # This job never checked anything out -- it only downloaded artifacts. The
    # tag message is needed here now, and reading it needs the repository and
    # the tag object, hence fetch-depth 0.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts

    - name: List all artifacts
      run: |
        echo "=== Release Artifacts ==="
        find artifacts -type f | sort

    # Record bare filenames, not the artifact directory layout.
    #
    # The paths used to come out as artifacts/gui-linux-artifacts/<file>, so the
    # "sha256sum -c checksums.txt" the release notes advertise failed for anyone
    # who downloaded the assets: they arrive flat, not under that tree. v0.2.0
    # shipped with a checksums file that had to be corrected by hand before
    # publication.
    - name: Calculate checksums
      run: |
        set -euo pipefail
        find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar.xz" \) -print0 |
          while IFS= read -r -d '' file; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done > artifacts/checksums.txt
        echo "=== Checksums ===" && cat artifacts/checksums.txt

    # The tag is created here and nowhere earlier: a version number spent on a
    # run whose Windows build then failed is a number that can never be reused.
    # By this point both platforms have built and their archives are in hand.
    #
    # A tag pushed with GITHUB_TOKEN does not start another workflow run --
    # GitHub's own loop protection -- so this does not re-enter the push
    # trigger above.
    - name: Create the annotated tag
      if: github.event_name == 'workflow_dispatch'
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Annotated, never lightweight. The notes no longer come from the tag
        # on this path -- GitHub generates them below -- but an annotated tag
        # carries its own date and is what "git describe" prefers, and a
        # lightweight one would hand the commit's message back to anyone who
        # asked the tag what it said (#37).
        git tag -a "$TAG" -m "Superview ${TAG}"
        git push origin "refs/tags/${TAG}"
        echo "Tagged $(git rev-parse --short HEAD) as ${TAG}"

    # What goes above GitHub's generated list.
    #
    # The generated notes say what changed -- one line per merged pull request,
    # plus a compare link. What they cannot say is which file to download and
    # how to check it, so that is what this writes, and the publish step below
    # pre-pends it to the generated list.
    #
    # A hand-pushed annotated tag is the one case where a human wrote notes on
    # purpose: its message leads, ahead of everything else. A lightweight tag
    # has no message of its own -- git would hand back the commit's -- so it
    # gets nothing but the download section, and says so in the run log.
    - name: Write the download section
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        kind="$(git cat-file -t "$TAG" 2>/dev/null || echo none)"
        subject="$(git tag -l --format='%(contents:subject)' "$TAG")"
        # Outside the redirected group on purpose: inside it, the warning would
        # be written into the release notes instead of the run log.
        if [ "$EVENT" = "push" ] && [ "$kind" != "tag" ]; then
          echo "::warning::${TAG} is lightweight, so it carries no notes of its own. The release still gets the generated list. Use 'git tag -a' to write your own."
        fi
        {
          # Only a hand-written message is worth leading with. The button tags
          # with "Superview vx.y.z", which would be a heading saying nothing.
          if [ "$EVENT" = "push" ] && [ "$kind" = "tag" ] && [ -n "$subject" ]; then
            printf '## %s\n\n' "$subject"
            git tag -l --format='%(contents:body)' "$TAG"
            printf '\n'
          fi
          printf '### Downloads\n\n'
          printf -- '- Windows: `superview-gui-%s-windows-x86_64.zip`\n' "$TAG"
          printf -- '- Linux (Ubuntu 24.04+): `superview-gui-%s-linux-x86_64.tar.xz`\n' "$TAG"
          printf '\n### Verify integrity\n\n'
          printf '```bash\nsha256sum -c checksums.txt\n```\n'
        } > /tmp/release.md
        echo "=== Body, which the generated list is appended to ===" && cat /tmp/release.md

    - name: Publish release assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        draft: ${{ needs.prepare.outputs.draft }}
        prerelease: ${{ needs.prepare.outputs.prerelease }}
        # body_path is pre-pended to the generated notes, so the release reads
        # download section first, then "What's Changed" built from the pull
        # requests merged since the previous tag.
        body_path: /tmp/release.md
        generate_release_notes: true
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
          artifacts/**/*.tar.xz
          artifacts/checksums.txt

  notify:
    name: Notify Release Status
    needs: [prepare, test, build-gui-windows, build-gui-linux, create-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
    # This step used to print "✅ Release workflow completed / Tests: PASSED"
    # unconditionally, under if: always(). So the v0.1.5 and v0.1.6 runs ended
    # on a green, congratulatory summary while the Linux build had failed and no
    # release had been created at all. Nobody noticed for over a month, and the
    # published version stayed three tags behind. A summary that cannot report
    # failure is worse than no summary.
    - name: Report what actually happened
      run: |
        set -uo pipefail
        echo "Plan:           ${{ needs.prepare.result }}"
        echo "Tests:          ${{ needs.test.result }}"
        echo "Windows build:  ${{ needs.build-gui-windows.result }}"
        echo "Linux build:    ${{ needs.build-gui-linux.result }}"
        echo "Release:        ${{ needs.create-release.result }}"
        echo ""

        failed=0
        for result in "${{ needs.prepare.result }}" \
                      "${{ needs.test.result }}" \
                      "${{ needs.build-gui-windows.result }}" \
                      "${{ needs.build-gui-linux.result }}"; do
          [ "$result" = "success" ] || failed=1
        done

        case "${{ needs.create-release.result }}" in
          success)
            if [ "${{ needs.prepare.outputs.draft }}" = "true" ]; then
              echo "Draft ${{ needs.prepare.outputs.tag }} created. Publishing it is still a manual step."
            else
              echo "Released ${{ needs.prepare.outputs.tag }}. The assets are public."
            fi
            ;;
          skipped)
            # Expected on a dry run: both platforms are built and uploaded, but
            # nothing is tagged and nothing is published.
            echo "Dry run: no version was given, so nothing was tagged or published."
            ;;
          *)
            failed=1
            ;;
        esac

        if [ "$failed" -ne 0 ]; then
          echo "::error::the release run did not complete successfully -- see the job results above"
          exit 1
        fi
        echo "Release run completed successfully."
