name: Release

on:
  push:
    tags:
      - 'v*'
      - 'RC-*'
  # Three ways in, and they all end at an annotated tag and a published
  # release whose notes GitHub generates from the pull requests merged since
  # the previous tag.
  #
  #   Dispatch with a version -- the button, and the whole of it. Nothing to
  #   prepare, nothing to write: the run builds both platforms and the Resolve
  #   plugin, and only once they have passed does it tag and publish.
  #
  #   Dispatch with no version -- a dry run. Builds both platforms and the
  #   plugin, tags nothing, publishes nothing. This is how a change to this file gets tried
  #   without spending a version number, and it is the reason v0.1.5 and
  #   v0.1.6 could break unnoticed for two months when it did not exist.
  #
  #   Pushing a tag by hand -- the escape hatch, and the way to write notes
  #   yourself: an annotated tag's message leads the release body, ahead of the
  #   generated list. The release stops at a draft.
  #
  # Notes used to live in RELEASE_NOTES.md, which the run copied into the tag.
  # That file had to be rewritten before every release, was easy to forget --
  # so the run had to grow a check that its first line named the version being
  # released -- and it sat in master permanently holding the *previous*
  # release's text, which reads exactly like something stale. The list GitHub
  # generates from merged pull requests says what changed without any of that.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.3. Leave empty for a dry run that publishes nothing.'
        required: false
        default: ''
      draft:
        description: 'Stop at a draft instead of publishing'
        type: boolean
        default: false
      prerelease:
        description: 'Release candidate: tags RC-x.y.z instead of vx.y.z'
        type: boolean
        default: false

# Read-only for every job but the one that tags and publishes. The build jobs
# run third-party code -- build scripts and proc macros -- with the token actions/checkout
# persists in .git/config, and a writable one there could push (E-24).
permissions:
  contents: read

jobs:
  # Everything the rest of the run needs to know is decided once, here.
  #
  # Deciding it per job is how the version came to be derived by stripping a
  # leading "v" in two separate places, which worked for a v-tag and for no
  # other ref the triggers admit -- the first manual dispatch died on
  # "--app-version master" in both build jobs (#40).
  prepare:
    name: Work out what this run is
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      label: ${{ steps.plan.outputs.label }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      draft: ${{ steps.plan.outputs.draft }}
      prerelease: ${{ steps.plan.outputs.prerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Plan the run
      id: plan
      # Inputs reach the script through the environment, never interpolated
      # into it: a ${{ }} inside a run: block is executed by the shell.
      env:
        EVENT: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail

        if [ "$EVENT" = "push" ]; then
          tag="${GITHUB_REF_NAME}"
          release=true
          # No checkbox on this path, so it keeps the cautious default it has
          # always had: a draft that someone has to look at and publish.
          draft=true
          case "$tag" in RC-*) prerelease=true ;; *) prerelease=false ;; esac
        elif [ -z "$INPUT_VERSION" ]; then
          # A dry run labels its archives with the branch, and branches here are
          # named fix/..., feat/..., docs/... -- a slash in the middle of a file
          # name is a directory that does not exist, which is how the first dry
          # run off master died on "mv: cannot move ... No such file or
          # directory". Nothing downstream needs the exact branch name.
          {
            echo "tag="
            echo "label=${GITHUB_REF_NAME//\//-}"
            echo "version=0.0.0"
            echo "release=false"
            echo "draft=false"
            echo "prerelease=false"
          } >> "$GITHUB_OUTPUT"
          echo "No version given: dry run. Both platforms and the plugin build; nothing is tagged or published."
          exit 0
        else
          if ! printf '%s' "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be x.y.z, got '${INPUT_VERSION}'"
            exit 1
          fi
          draft="$INPUT_DRAFT"
          prerelease="$INPUT_PRERELEASE"
          if [ "$prerelease" = "true" ]; then
            tag="RC-${INPUT_VERSION}"
          else
            tag="v${INPUT_VERSION}"
          fi
          release=true
        fi

        # superview-app's build.rs (SUPERVIEW_VERSION) accepts x.y.z and nothing else.
        if [[ "$tag" =~ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
          version="${BASH_REMATCH[1]}"
        else
          echo "::error::tag '${tag}' contains no x.y.z version, so the binary cannot be stamped"
          exit 1
        fi

        if [ "$EVENT" != "push" ]; then
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists -- pick another version, or delete the tag if it was a mistake"
            exit 1
          fi
        fi

        {
          echo "tag=${tag}"
          echo "label=${tag}"
          echo "version=${version}"
          echo "release=${release}"
          echo "draft=${draft}"
          echo "prerelease=${prerelease}"
        } >> "$GITHUB_OUTPUT"
        echo "tag=${tag} version=${version} release=${release} draft=${draft} prerelease=${prerelease}"

  # The Rust workspace, as rust.yml runs it, plus what a release adds: a coverage floor and a
  # dependency audit. Tools are installed at a pinned version, --locked, like every download
  # here. The audit's advisory database is the exception: it is fetched fresh, so a new
  # advisory can block a release (see the audit step).
  test:
    name: Run Tests Before Release
    needs: prepare
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The runner has rustup; rust-toolchain.toml selects the pinned version.
    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: .

    # ffmpeg matters here, and not only to run more tests. Without it every
    # integration test used to skip, and module coverage measured 51.4%
    # instead of 59.3% -- a gate of 50% away from failing a release for a
    # reason that had nothing to do with the release, and, worse, passing one
    # on a suite that had encoded nothing. SUPERVIEW_REQUIRE_FFMPEG below now
    # turns that silence into a failure, so the coverage number no longer
    # carries the news on its own.
    #
    # libfontconfig1-dev: Slint's text layout is built against it and the runner
    # image does not have it. The window's other libraries are loaded at run time.
    - name: Install FFmpeg and the window's build libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg libfontconfig1-dev

    - name: Format
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    # llvm-tools is what cargo-llvm-cov reads the profiles with. The versions are pinned: the
    # coverage figure and the advisory check must not move because a tool did.
    - name: Install the coverage and audit tools
      run: |
        set -euo pipefail
        rustup component add llvm-tools
        cargo install --locked --version 0.9.1 cargo-llvm-cov
        cargo install --locked --version 0.22.2 cargo-audit

    # One run, not two: the suite used to run once for the verdict and again for the profile
    # (E-24), and cargo-llvm-cov runs `cargo test` itself. The floor is 50 % of lines,
    # the same as the "Rust coverage and audit" job of rust.yml: a floor to raise as coverage grows.
    - name: Run tests and the coverage gate
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: cargo llvm-cov --workspace --locked --fail-under-lines 50

    # Fails on a known vulnerability in Cargo.lock. Advisories for unmaintained crates only
    # warn: they are not a reason to block a release. The advisory database is NOT pinned: an
    # advisory published this morning can block a release this afternoon. The way out is a
    # reasoned `ignore` (.cargo/audit.toml for cargo audit, deny.toml for cargo deny), not removing the step.
    - name: Audit the dependencies
      run: cargo audit

  build-gui-windows:
    name: Build GUI (Windows)
    needs: [prepare, test]
    runs-on: windows-latest

    env:
      # The FFmpeg shipped inside the Windows installer.
      #
      # 8.1.1 rather than 8.1.2, and the reason is the whole point of bundling.
      # The NVENC driver floor is fixed when FFmpeg is compiled, by the
      # nv-codec-headers it is built against -- not by the FFmpeg version. Between
      # gyan.dev's 8.1.1 and 8.1.2 that floor went from 570.0 to 610.00, and the
      # NVIDIA RTX Enterprise driver branch tops out at 597.06: on a professional
      # card, 8.1.2 can never use NVENC, however current the driver is. That is
      # the bug report this bundling answers (ANALYSE.md U-03).
      #
      # So the property being pinned is the floor, not the version. The step below
      # reads it back out of the downloaded binary and fails if it is not 570.0 --
      # bumping this pin to a build compiled against newer headers is exactly the
      # mistake that would re-break the machines this protects.
      #
      # "essentials" carries libx264, libx265, nvenc, amf and qsv, which is all
      # Superview targets, and is a third of the size of "full".
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-essentials_build.7z
      FFMPEG_SHA256: 23ad8969fbe701d44e6e7e2b97c5fae4a71224fc33a2560a9034e5110d029d15
      FFMPEG_DRIVER_FLOOR: '570.0'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # No cargo cache in the build jobs: the build marker must describe this build, and a
    # restored target/ is the one place a stale one could come from (DEC-47). The cost is a
    # build from scratch per release, which a release can afford.
    #
    # The version is passed here rather than committed in a file: a number in a file drifts
    # from the tag the moment master moves past a release, and the binary would then claim
    # to be something it is not. superview-app's build.rs reads SUPERVIEW_VERSION, refuses
    # anything but x.y.z, and embeds it, with the revision and the "modified" state, in the
    # binary and in its Windows version resource. rust-toolchain.toml selects the compiler.
    - name: Build GUI (native arch)
      env:
        SUPERVIEW_VERSION: ${{ needs.prepare.outputs.version }}
      run: cargo build --release --locked -p superview-app

    # The version stamp is this project's answer to "which build produced
    # this?", so a release that gets it wrong is worse than one that says
    # nothing. v0.2.3 shipped announcing "0.2.3 (9c1a8c5, modified)" from a
    # pristine checkout, and nothing in the run noticed. This asserts the
    # outcome rather than the cause: whatever leaves a file in the tree during
    # the build, the binary is what gets stamped, so the binary is what gets
    # checked. The binary carries a readable marker for it, SUPERVIEW-BUILD
    # version=... revision=... modified=..., found by pattern in the raw bytes
    # (Latin-1 maps each byte to one character).
    - name: The built binary must not claim to be modified
      shell: pwsh
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $bytes = [System.IO.File]::ReadAllBytes("target\release\superview.exe")
        $text = [System.Text.Encoding]::Latin1.GetString($bytes)
        $found = [regex]::Match($text, 'SUPERVIEW-BUILD[ -~]*')
        if (-not $found.Success) {
          Write-Host "::error::the SUPERVIEW-BUILD marker is missing from the release binary"
          exit 1
        }
        Write-Host $found.Value
        # The positive is required, not just the absence of modified=true: when git fails,
        # build.rs writes no revision and modified=false, and the absence would pass.
        $head = (git rev-parse HEAD).Trim()
        if ($found.Value -notmatch ("revision=" + [regex]::Escape($head) + " modified=false$")) {
          Write-Host "::error::the binary is not stamped with this commit and modified=false, so it may announce itself as ', modified' or with no revision. Something left an unignored file in the working tree while it was built, or git failed."
          git status --porcelain
          exit 1
        }
        if ($found.Value -notmatch ("version=" + [regex]::Escape($env:VERSION) + "( |$)")) {
          Write-Host "::error::the binary is not stamped with version $env:VERSION"
          exit 1
        }

    # Downloaded into RUNNER_TEMP, never into the checkout: an unignored file in
    # the working tree during the build is what stamps the binary modified, and the
    # step above exists because that has already shipped once.
    - name: Fetch and verify the pinned FFmpeg
      shell: bash
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/ffmpeg-bundle.7z"
        curl -fsSL -o "$archive" "$FFMPEG_URL"
        echo "${FFMPEG_SHA256}  ${archive}" | sha256sum -c -

        7z x -y -o"${RUNNER_TEMP}/ffmpeg-bundle" "$archive" > /dev/null
        bin_dir="$(find "${RUNNER_TEMP}/ffmpeg-bundle" -type d -name bin | head -n 1)"
        if [ -z "$bin_dir" ]; then
          echo "::error::the pinned FFmpeg archive has no bin/ directory; its layout changed"
          find "${RUNNER_TEMP}/ffmpeg-bundle" -maxdepth 2
          exit 1
        fi
        mkdir -p build
        cp "$bin_dir/ffmpeg.exe" "$bin_dir/ffprobe.exe" build/

    - name: The bundled FFmpeg must demand the driver floor we measured
      shell: bash
      run: |
        set -euo pipefail
        source .github/scripts/nvenc-driver-floor.sh
        assert_driver_floor "$FFMPEG_DRIVER_FLOOR" build/ffmpeg.exe build/ffprobe.exe

    # One file to download, instead of a zip to extract: an Inno Setup installer.
    #
    # ffmpeg.exe and ffprobe.exe are installed beside superview.exe, which is the
    # first place the application looks for them.
    - name: Stage the installer's files
      shell: pwsh
      run: |
        Copy-Item "target\release\superview.exe" "build\superview.exe"
        Copy-Item "THIRD_PARTY_NOTICES.md" "build\"

    # Inno Setup 6 is preinstalled on the runner. SourceDir is absolute because
    # Inno resolves relative paths against the script, not the working directory.
    - name: Build the installer
      shell: pwsh
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
        LABEL: ${{ needs.prepare.outputs.label }}
      run: |
        $archLabel = "x86_64"
        $source = Join-Path $PWD "build"
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$source" packaging\windows\superview.iss
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Move-Item "build\superview-setup.exe" "superview-$env:LABEL-windows-$archLabel-setup.exe"

    # Installs for the current user without a prompt, checks what landed where the
    # application will look for it, runs the bundled tools, then uninstalls and
    # checks nothing is left. Starting the GUI is not tried here: the runner has no
    # display, and the Linux job covers that with xvfb.
    - name: The installer must install, run and uninstall cleanly
      shell: pwsh
      run: |
        $setup = Get-ChildItem "superview-*-setup.exe" | Select-Object -First 1
        Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/CURRENTUSER'
        $dir = "$env:LOCALAPPDATA\Programs\Superview"
        foreach ($f in 'superview.exe', 'ffmpeg.exe', 'ffprobe.exe', 'THIRD_PARTY_NOTICES.md') {
          if (-not (Test-Path "$dir\$f")) { Write-Error "$f missing from $dir"; exit 1 }
        }
        # The whole output is captured before the first line is taken: cutting the
        # pipe early with Select-Object -First 1 makes the tool exit non-zero.
        $out = & "$dir\ffmpeg.exe" -version
        if ($LASTEXITCODE -ne 0) { Write-Error "the installed ffmpeg.exe does not run"; exit 1 }
        $out | Select-Object -First 1
        $out = & "$dir\ffprobe.exe" -version
        if ($LASTEXITCODE -ne 0) { Write-Error "the installed ffprobe.exe does not run"; exit 1 }
        $out | Select-Object -First 1
        Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT'
        Start-Sleep -Seconds 5
        if (Test-Path "$dir\superview.exe") { Write-Error "the uninstaller left superview.exe behind"; exit 1 }
        Write-Host "install, bundled tools and uninstall: ok"

    - name: Upload GUI artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gui-windows-artifacts
        path: superview-${{ needs.prepare.outputs.label }}-windows-*-setup.exe
        # Uploading nothing is not success: without this the release job would
        # publish an empty draft.
        if-no-files-found: error

  # The OpenFX plugin for DaVinci Resolve, as a zip of the Superview.ofx.bundle folder that the
  # user copies into C:\Program Files\Common Files\OFX\Plugins (DEC-69). Windows only: the Linux
  # bundle stays a CI artifact of rust.yml until Resolve has been tried on Linux. A job of its
  # own, so it builds while the installer does.
  build-ofx-windows:
    name: Build the Resolve plugin (Windows)
    needs: [prepare, test]
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # No cargo cache, as in the GUI jobs (DEC-47): what is zipped is this build. bindgen
    # (ofx_sys) finds libclang in the runner's LLVM, as in rust.yml's ofx-bundle job.
    - name: Build the bundle
      run: sh packaging/ofx/build_bundle.sh

    # Built from outside the folder it archives, so the zip cannot end up inside itself.
    - name: Zip the bundle
      env:
        LABEL: ${{ needs.prepare.outputs.label }}
      run: |
        set -euo pipefail
        ( cd target/ofx && 7z a -tzip "../../superview-ofx-${LABEL}-windows-x86_64.zip" Superview.ofx.bundle > /dev/null )
        ls -l superview-ofx-*-windows-x86_64.zip

    # What is checked is the zip a user downloads, not the folder it was made from: one folder,
    # the library and its licences, and the two entry points Resolve calls at load. Resolve itself
    # is not on a runner, so loading the plugin is a manual test (RELEASING.md).
    - name: The archive must hold a plugin Resolve can load
      run: sh packaging/ofx/check_bundle_zip.sh superview-ofx-*-windows-x86_64.zip

    - name: Upload the plugin archive
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ofx-windows-artifacts
        path: superview-ofx-${{ needs.prepare.outputs.label }}-windows-x86_64.zip
        if-no-files-found: error

  build-gui-linux:
    name: Build GUI (Linux)
    needs: [prepare, test]
    runs-on: ubuntu-latest

    env:
      # The FFmpeg shipped inside the Linux archive. Same reasoning as the
      # Windows job: what is pinned is the NVENC driver floor, 570.0, and the
      # step below reads it back out of the binary.
      #
      # BtbN rather than gyan.dev, who builds for Windows only. The pin is the
      # autobuild of 2026-08-31, FFmpeg n8.1.2 at git 1a748fe2cd, GPL, linux64
      # -- a later version than Windows' 8.1.1, and still at the 570.0 floor
      # because BtbN compiles against older nv-codec-headers than gyan.dev.
      # A month-end autobuild on purpose: BtbN prunes mid-month builds -- the
      # pin in the fork this idea came from is already a 404 -- but keeps the
      # last build of each month, and those have held since October 2024.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-8.1.tar.xz
      FFMPEG_SHA256: c733b4b2951e5957e15505f788b2c65a7a41b6da4b289e295852cc38079b4d2b
      FFMPEG_DRIVER_FLOOR: '570.0'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # libfontconfig1-dev: Slint's text layout is built against it (as in rust.yml).
    #
    # libxkbcommon0, libxkbcommon-x11-0 and libxcb-xkb1 are installed for ONE reason: the
    # AppImage embeds copies of them, taken from here when it is built. All three, because
    # libxkbcommon-x11 mixed with another version of libxkbcommon crashes (DEC-47). winit loads
    # them at run time (dlopen) and a minimal system may not have them. The launch test below removes them again before
    # starting the image, so that the test proves the embedded copies are the ones used.
    #
    # xvfb and mesa are for the launch test only.
    - name: Install the build libraries and the AppImage tooling
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1 xvfb libgl1-mesa-dri
        curl -fsSL -o "${RUNNER_TEMP}/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  ${RUNNER_TEMP}/appimagetool" | sha256sum -c -
        chmod +x "${RUNNER_TEMP}/appimagetool"

    # No cargo cache here either (see the Windows job). The binary is linked with an RPATH of
    # $ORIGIN/../lib by build.rs, which is how it finds the embedded libraries (DEC-47).
    - name: Build GUI (native arch)
      env:
        SUPERVIEW_VERSION: ${{ needs.prepare.outputs.version }}
      run: cargo build --release --locked -p superview-app

    # The version stamp is this project's answer to "which build produced
    # this?", so a release that gets it wrong is worse than one that says
    # nothing. v0.2.3 shipped announcing "0.2.3 (9c1a8c5, modified)" from a
    # pristine checkout, and nothing in the run noticed. This asserts the
    # outcome rather than the cause: whatever leaves a file in the tree during
    # the build, the binary is what gets stamped, so the binary is what gets
    # checked.
    - name: The built binary must not claim to be modified
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        set -euo pipefail
        # grep -o prints the marker alone; -a reads the binary as text.
        marker="$(grep -ao 'SUPERVIEW-BUILD[ -~]*' target/release/superview || true)"
        if [ -z "$marker" ]; then
          echo "::error::the SUPERVIEW-BUILD marker is missing from the release binary"
          exit 1
        fi
        echo "$marker"
        # The positive is required, not just the absence of modified=true: when git fails,
        # build.rs writes no revision and modified=false, and the absence would pass.
        if ! printf '%s\n' "$marker" | grep -Eq "revision=$(git rev-parse HEAD) modified=false\$"; then
          echo "::error::the binary is not stamped with this commit and modified=false, so it may announce itself as ', modified' or with no revision. Something left an unignored file in the working tree while it was built, or git failed."
          git status --porcelain
          exit 1
        fi
        if ! printf '%s\n' "$marker" | grep -Eq "version=${VERSION//./\\.}( |\$)"; then
          echo "::error::the binary is not stamped with version ${VERSION}"
          exit 1
        fi
        # The embedded libraries are only found through this RPATH.
        readelf -d target/release/superview | grep -E 'RPATH|RUNPATH' || true
        # shellcheck disable=SC2016
        if ! readelf -d target/release/superview | grep -q '(RPATH).*\$ORIGIN/\.\./lib'; then
          echo "::error::the binary has no DT_RPATH of \$ORIGIN/../lib; the AppImage's libraries would not be found"
          exit 1
        fi

    # Into RUNNER_TEMP, never the checkout: an unignored file in the working
    # tree stamps the binary modified, which the step above exists to catch.
    - name: Fetch and verify the pinned FFmpeg
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/ffmpeg-bundle.tar.xz"
        curl -fsSL -o "$archive" "$FFMPEG_URL"
        echo "${FFMPEG_SHA256}  ${archive}" | sha256sum -c -

        mkdir -p "${RUNNER_TEMP}/ffmpeg-bundle"
        tar -xJf "$archive" -C "${RUNNER_TEMP}/ffmpeg-bundle"
        bin_dir="$(find "${RUNNER_TEMP}/ffmpeg-bundle" -type d -name bin | head -n 1)"
        if [ -z "$bin_dir" ]; then
          echo "::error::the pinned FFmpeg archive has no bin/ directory; its layout changed"
          find "${RUNNER_TEMP}/ffmpeg-bundle" -maxdepth 2
          exit 1
        fi
        mkdir -p "${RUNNER_TEMP}/ffbin"
        cp "$bin_dir/ffmpeg" "$bin_dir/ffprobe" "${RUNNER_TEMP}/ffbin/"
        chmod 0755 "${RUNNER_TEMP}/ffbin/ffmpeg" "${RUNNER_TEMP}/ffbin/ffprobe"

    - name: The bundled FFmpeg must demand the driver floor we measured
      run: |
        set -euo pipefail
        source .github/scripts/nvenc-driver-floor.sh
        assert_driver_floor "$FFMPEG_DRIVER_FLOOR" "${RUNNER_TEMP}/ffbin/ffmpeg" "${RUNNER_TEMP}/ffbin/ffprobe"

    # The suite against the binary that ships, not the one apt installed in
    # the test job (6.1.1 there, n8.1.2 here). The bundled copy goes first on
    # PATH, as the Windows test job does with its pinned archive. After the
    # release build and its marker check on purpose: this step writes only to
    # target/debug and cannot touch what is checked or shipped.
    #
    # Not through a variable that overrides the tool lookup: it would also override the
    # stand-in ffmpegs the tests write for themselves and the resolution-order
    # tests (L-114). PATH leaves those their own directories and still makes every
    # real run use this FFmpeg.
    #
    # No profile: the test job already gated coverage; this run only has to be red
    # or green against this FFmpeg.
    - name: Run the tests against the bundled FFmpeg
      env:
        SUPERVIEW_REQUIRE_FFMPEG: '1'
      run: |
        export PATH="${RUNNER_TEMP}/ffbin:${PATH}"
        if [ "$(command -v ffmpeg)" != "${RUNNER_TEMP}/ffbin/ffmpeg" ]; then
          echo "::error::ffmpeg on PATH is $(command -v ffmpeg), not the bundled copy"
          exit 1
        fi
        cargo test --workspace --locked

    # The package is one AppImage. packaging/linux/build_appimage.sh takes the binary
    # itself, which carries the version and the marker the step above inspected.
    #
    # The tools go under usr/lib/superview inside the image, beside usr/bin: the
    # application looks in ../lib/superview relative to its own binary, and
    # nothing here can shadow the system's ffmpeg for other programs. The two X11
    # libraries go in usr/lib, found through the binary's RPATH and not through
    # LD_LIBRARY_PATH, which would leak to ffmpeg, zenity and kdialog.
    - name: Build the AppImage
      env:
        LABEL: ${{ needs.prepare.outputs.label }}
      run: |
        set -euo pipefail
        archLabel="$(uname -m)"
        APPIMAGETOOL="${RUNNER_TEMP}/appimagetool" sh packaging/linux/build_appimage.sh \
          target/release/superview "${RUNNER_TEMP}/ffbin" \
          "superview-${LABEL}-linux-${archLabel}.AppImage"
        ls -lah superview-*.AppImage

    # Asserting the outcome, as the Windows job does: the files are where the
    # application will look for them, the bundled tools run, and the GUI stays open.
    #
    # The launch happens WITHOUT libxkbcommon-x11 on the system: the package that was
    # installed to be copied is removed first (--force-depends: only that package goes, and
    # nothing here needs it), and its absence is asserted, otherwise the proof would be
    # empty. check_appimage_libs.sh then reads the loader's log (LD_DEBUG=libs) and fails
    # unless the three libraries (libxkbcommon too: the system one stays, and a mix of versions
    # crashes) were loaded from the image. libxcb-xkb1 stays installed (other
    # packages need it); the log is what shows that its embedded copy is the one used.
    #
    # APPIMAGE_EXTRACT_AND_RUN: GitHub's runners do not allow FUSE. timeout stops
    # the application after 20 s with code 124, so it was still open; any other
    # code means it exited by itself.
    - name: The AppImage must carry its tools and start
      run: |
        set -euo pipefail
        image="$(find . -maxdepth 1 -name 'superview-*.AppImage' | head -n 1)"
        export APPIMAGE_EXTRACT_AND_RUN=1

        rm -rf squashfs-root && "${image}" --appimage-extract > /dev/null
        for f in usr/bin/superview usr/lib/superview/ffmpeg usr/lib/superview/ffprobe usr/lib/libxkbcommon.so.0 usr/lib/libxkbcommon-x11.so.0 usr/lib/libxcb-xkb.so.1; do
          if [ ! -e "squashfs-root/$f" ]; then
            echo "::error::the AppImage has no $f"
            find squashfs-root -type f
            exit 1
          fi
        done
        # Into a file first: "| head -n 1" closes the pipe early, and under pipefail
        # the tool's SIGPIPE would then fail the step.
        for tool in ffmpeg ffprobe; do
          "squashfs-root/usr/lib/superview/${tool}" -version > "${RUNNER_TEMP}/${tool}-version.txt"
          head -n 1 "${RUNNER_TEMP}/${tool}-version.txt"
        done
        rm -rf squashfs-root

        sudo dpkg --remove --force-depends libxkbcommon-x11-0
        if dpkg -s libxkbcommon-x11-0 > /dev/null 2>&1 || [ -e /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 ]; then
          echo "::error::libxkbcommon-x11 is still on the system, so the launch below would prove nothing"
          exit 1
        fi
        echo "libxkbcommon-x11-0: absent from the system"

        set +e
        xvfb-run -a timeout 20 "${image}"
        code=$?
        set -e
        echo "exit code: ${code}"
        if [ "$code" -ne 124 ]; then
          echo "::error::the AppImage did not stay open (exit code ${code}; 124 was expected)"
          exit 1
        fi

        sh packaging/linux/check_appimage_libs.sh "${image}" 10

    - name: Upload GUI artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gui-linux-artifacts
        path: superview-${{ needs.prepare.outputs.label }}-linux-*.AppImage
        if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [prepare, build-gui-windows, build-ofx-windows, build-gui-linux]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.release == 'true'
    # The only job that writes: it pushes the tag and publishes the release.
    permissions:
      contents: write

    steps:
    # This job never checked anything out -- it only downloaded artifacts. The
    # tag message is needed here now, and reading it needs the repository and
    # the tag object, hence fetch-depth 0.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts

    - name: List all artifacts
      run: |
        echo "=== Release Artifacts ==="
        find artifacts -type f | sort

    # Record bare filenames, not the artifact directory layout.
    #
    # The paths used to come out as artifacts/gui-linux-artifacts/<file>, so the
    # "sha256sum -c checksums.txt" the release notes advertise failed for anyone
    # who downloaded the assets: they arrive flat, not under that tree. v0.2.0
    # shipped with a checksums file that had to be corrected by hand before
    # publication.
    - name: Calculate checksums
      run: |
        set -euo pipefail
        find artifacts -type f \( -name "*-setup.exe" -o -name "*.AppImage" -o -name "superview-ofx-*-windows-x86_64.zip" \) -print0 |
          while IFS= read -r -d '' file; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done > artifacts/checksums.txt
        echo "=== Checksums ===" && cat artifacts/checksums.txt

    # The tag is created here and nowhere earlier: a version number spent on a
    # run whose Windows build then failed is a number that can never be reused.
    # By this point both platforms and the plugin have built and their files are in hand.
    #
    # A tag pushed with GITHUB_TOKEN does not start another workflow run --
    # GitHub's own loop protection -- so this does not re-enter the push
    # trigger above.
    - name: Create the annotated tag
      if: github.event_name == 'workflow_dispatch'
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Annotated, never lightweight. The notes no longer come from the tag
        # on this path -- GitHub generates them below -- but an annotated tag
        # carries its own date and is what "git describe" prefers, and a
        # lightweight one would hand the commit's message back to anyone who
        # asked the tag what it said (#37).
        git tag -a "$TAG" -m "Superview ${TAG}"
        git push origin "refs/tags/${TAG}"
        echo "Tagged $(git rev-parse --short HEAD) as ${TAG}"

    # What goes above GitHub's generated list.
    #
    # The generated notes say what changed -- one line per merged pull request,
    # plus a compare link. What they cannot say is which file to download and
    # how to check it, so that is what this writes, and the publish step below
    # pre-pends it to the generated list.
    #
    # A hand-pushed annotated tag is the one case where a human wrote notes on
    # purpose: its message leads, ahead of everything else. A lightweight tag
    # has no message of its own -- git would hand back the commit's -- so it
    # gets nothing but the download section, and says so in the run log.
    - name: Write the download section
      env:
        TAG: ${{ needs.prepare.outputs.tag }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        kind="$(git cat-file -t "$TAG" 2>/dev/null || echo none)"
        subject="$(git tag -l --format='%(contents:subject)' "$TAG")"
        # Outside the redirected group on purpose: inside it, the warning would
        # be written into the release notes instead of the run log.
        if [ "$EVENT" = "push" ] && [ "$kind" != "tag" ]; then
          echo "::warning::${TAG} is lightweight, so it carries no notes of its own. The release still gets the generated list. Use 'git tag -a' to write your own."
        fi
        {
          # Only a hand-written message is worth leading with. The button tags
          # with "Superview vx.y.z", which would be a heading saying nothing.
          if [ "$EVENT" = "push" ] && [ "$kind" = "tag" ] && [ -n "$subject" ]; then
            printf '## %s\n\n' "$subject"
            git tag -l --format='%(contents:body)' "$TAG"
            printf '\n'
          fi
          printf '### Downloads\n\n'
          printf -- '- Windows: `superview-%s-windows-x86_64-setup.exe`\n' "$TAG"
          printf -- '- Linux (Ubuntu 24.04+): `superview-%s-linux-x86_64.AppImage`\n' "$TAG"
          printf -- '- DaVinci Resolve plugin (Windows): `superview-ofx-%s-windows-x86_64.zip`\n' "$TAG"
          printf '\n### Verify integrity\n\n'
          printf '```bash\nsha256sum -c checksums.txt\n```\n'
        } > /tmp/release.md
        echo "=== Body, which the generated list is appended to ===" && cat /tmp/release.md

    - name: Publish release assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        draft: ${{ needs.prepare.outputs.draft }}
        prerelease: ${{ needs.prepare.outputs.prerelease }}
        # body_path is pre-pended to the generated notes, so the release reads
        # download section first, then "What's Changed" built from the pull
        # requests merged since the previous tag.
        body_path: /tmp/release.md
        generate_release_notes: true
        files: |
          artifacts/**/*-setup.exe
          artifacts/**/*.AppImage
          artifacts/**/superview-ofx-*-windows-x86_64.zip
          artifacts/checksums.txt

  notify:
    name: Notify Release Status
    needs: [prepare, test, build-gui-windows, build-ofx-windows, build-gui-linux, create-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
    # This step used to print "✅ Release workflow completed / Tests: PASSED"
    # unconditionally, under if: always(). So the v0.1.5 and v0.1.6 runs ended
    # on a green, congratulatory summary while the Linux build had failed and no
    # release had been created at all. Nobody noticed for over a month, and the
    # published version stayed three tags behind. A summary that cannot report
    # failure is worse than no summary.
    #
    # Through env, like the prepare job: a ${{ }} inside a run: block is
    # executed by the shell, and the tag is user input (E-24).
    - name: Report what actually happened
      env:
        PLAN: ${{ needs.prepare.result }}
        TESTS: ${{ needs.test.result }}
        WINDOWS: ${{ needs.build-gui-windows.result }}
        PLUGIN: ${{ needs.build-ofx-windows.result }}
        LINUX: ${{ needs.build-gui-linux.result }}
        RELEASE: ${{ needs.create-release.result }}
        DRAFT: ${{ needs.prepare.outputs.draft }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        set -uo pipefail
        echo "Plan:           ${PLAN}"
        echo "Tests:          ${TESTS}"
        echo "Windows build:  ${WINDOWS}"
        echo "Plugin build:   ${PLUGIN}"
        echo "Linux build:    ${LINUX}"
        echo "Release:        ${RELEASE}"
        echo ""

        failed=0
        for result in "$PLAN" "$TESTS" "$WINDOWS" "$PLUGIN" "$LINUX"; do
          [ "$result" = "success" ] || failed=1
        done

        case "$RELEASE" in
          success)
            if [ "$DRAFT" = "true" ]; then
              echo "Draft ${TAG} created. Publishing it is still a manual step."
            else
              echo "Released ${TAG}. The assets are public."
            fi
            ;;
          skipped)
            # Expected on a dry run: both platforms and the plugin are built and uploaded, but
            # nothing is tagged and nothing is published.
            echo "Dry run: no version was given, so nothing was tagged or published."
            ;;
          *)
            failed=1
            ;;
        esac

        if [ "$failed" -ne 0 ]; then
          echo "::error::the release run did not complete successfully -- see the job results above"
          exit 1
        fi
        echo "Release run completed successfully."
