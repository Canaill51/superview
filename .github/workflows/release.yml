name: Release

on:
  push:
    tags:
      - 'v*'
      - 'RC-*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
    
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
    
    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Run tests
      run: go test ./... -v
    
    - name: Run coverage check
      run: |
        go test ./... -coverprofile=coverage.out
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        if (( $(echo "$coverage < 50" | bc -l) )); then
          echo "❌ Coverage ${coverage}% below 50% gate"
          exit 1
        fi
        echo "✅ Coverage ${coverage}% passes gate"

  build-gui-windows:
    name: Build GUI (Windows)
    needs: test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
    
    - name: Build GUI (native arch)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build
        ARCH="$(go env GOARCH)"
        go run fyne.io/tools/cmd/fyne@latest package -os windows -icon Icon.png -name "superview-gui-windows-${ARCH}"
        mv "superview-gui-windows-${ARCH}.exe" "build/superview-gui-windows-${ARCH}.exe"
    
    - name: Create archives
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        $arch = go env GOARCH
        switch ($arch) {
          "amd64" { $archLabel = "x86_64" }
          "386" { $archLabel = "i386" }
          "arm64" { $archLabel = "aarch64" }
          default { $archLabel = $arch }
        }
        Compress-Archive -Path "build/superview-gui-windows-$arch.exe" -DestinationPath "superview-gui-$version-windows-$archLabel.zip" -Force
    
    - name: Upload GUI artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gui-windows-artifacts
        path: superview-gui-${{ github.ref_name }}-windows-*.zip

  build-gui-linux:
    name: Build GUI (Linux)
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Build GUI (native arch)
      run: |
        set -euo pipefail
        mkdir -p build
        ARCH="$(go env GOARCH)"
        go run fyne.io/tools/cmd/fyne@latest package -os linux -icon Icon.png -name "superview-gui-linux-${ARCH}" .
        
    - name: Inspect build directory
      run: |
        echo "ARCH=$(go env GOARCH)"
        ls -lah build

    - name: Create archive
      run: |
        set -euo pipefail
        version="${{ github.ref_name }}"
        arch="$(go env GOARCH)"
        case "$arch" in
          amd64) archLabel="x86_64" ;;
          386) archLabel="i386" ;;
          arm64) archLabel="aarch64" ;;
          *) archLabel="$arch" ;;
        esac
        tar -C build -czf "superview-gui-${version}-linux-${archLabel}.tar.gz" "superview-gui-linux-${arch}"

    - name: Upload GUI artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gui-linux-artifacts
        path: superview-gui-${{ github.ref_name }}-linux-*.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-gui-windows, build-gui-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/RC-')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
    
    - name: List all artifacts
      run: |
        echo "=== Release Artifacts ==="
        find artifacts -type f | sort
    
    - name: Calculate checksums
      run: |
        find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | while read file; do
          sha256sum "$file"
        done > artifacts/checksums.txt
        echo "=== Checksums ===" && cat artifacts/checksums.txt
    
    - name: Create release summary
      run: |
        version="${GITHUB_REF_NAME}"
        echo "## Release ${version} - Superview" > /tmp/release.md
        echo "" >> /tmp/release.md
        echo "### GUI Application" >> /tmp/release.md
        echo "- Windows: native runner arch" >> /tmp/release.md
        echo "" >> /tmp/release.md
        echo "- Linux: native runner arch (Ubuntu 24.04 compatible)" >> /tmp/release.md
        echo "" >> /tmp/release.md
        echo "### Verify Integrity" >> /tmp/release.md
        echo "\`\`\`bash" >> /tmp/release.md
        echo "sha256sum -c checksums.txt" >> /tmp/release.md
        echo "\`\`\`" >> /tmp/release.md
        cat /tmp/release.md

    - name: Publish release assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        draft: true
        prerelease: ${{ startsWith(github.ref, 'refs/tags/RC-') }}
        body_path: /tmp/release.md
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
          artifacts/checksums.txt

  notify:
    name: Notify Release Status
    needs: [test, build-gui-windows, build-gui-linux, create-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check release status
      run: |
        echo "✅ Release workflow completed"
        echo "  - Tests: PASSED"
        echo "  - Windows: native runner arch"
        echo "  - Linux: native runner arch (needs libgl1-mesa-dev, xorg-dev at runtime;"
        echo "           zenity or kdialog recommended for native file dialogs)"
        echo ""
        echo "📦 Artifacts ready in: GitHub Release page"
        echo "📝 Next: Manual publish of draft release"
