name: Release

on:
  push:
    tags:
      - 'v*'
      - 'RC-*'
  # A tag push was the only trigger, so the only way to test a change to this
  # file was to cut a release. The v0.1.5 and v0.1.6 runs failed in July, were
  # "fixed" over four commits, and those fixes were never run: no tag has been
  # pushed since. Manual dispatch builds and uploads the artifacts without
  # publishing anything -- create-release stays gated on the ref being a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
    
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
    
    # ffmpeg matters here, and not only to run more tests: without it every
    # integration test skips and module coverage measures 51.4% instead of
    # 59.3%. The gate is 50%, so this job was one small change away from
    # failing a release for a reason that had nothing to do with the release.
    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev ffmpeg

    - name: Run tests
      run: go test ./... -v
    
    - name: Run coverage check
      run: |
        go test ./... -coverprofile=coverage.out
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        if (( $(echo "$coverage < 50" | bc -l) )); then
          echo "❌ Coverage ${coverage}% below 50% gate"
          exit 1
        fi
        echo "✅ Coverage ${coverage}% passes gate"

  build-gui-windows:
    name: Build GUI (Windows)
    needs: test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
    
    # The packaging tool is pinned, like every action in this repository is
    # pinned by SHA. Fetching @latest at release time meant an upstream change
    # to the tool's output name or location could break a release with no change
    # on our side -- which is the exact shape of the failure that kept v0.1.5
    # and v0.1.6 from ever being published.
    - name: Build GUI (native arch)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build
        ARCH="$(go env GOARCH)"
        go run fyne.io/tools/cmd/fyne@v1.7.2 package -os windows -icon Icon.png -name "superview-gui-windows-${ARCH}"
        mv "superview-gui-windows-${ARCH}.exe" "build/superview-gui-windows-${ARCH}.exe"
    
    - name: Create archives
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        $arch = go env GOARCH
        switch ($arch) {
          "amd64" { $archLabel = "x86_64" }
          "386" { $archLabel = "i386" }
          "arm64" { $archLabel = "aarch64" }
          default { $archLabel = $arch }
        }
        Compress-Archive -Path "build/superview-gui-windows-$arch.exe" -DestinationPath "superview-gui-$version-windows-$archLabel.zip" -Force
    
    - name: Upload GUI artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gui-windows-artifacts
        path: superview-gui-${{ github.ref_name }}-windows-*.zip
        # Uploading nothing is not success: without this the release job would
        # publish an empty draft.
        if-no-files-found: error

  build-gui-linux:
    name: Build GUI (Linux)
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    # "fyne package" writes its archive in the working directory, not in a
    # build/ subdirectory. The previous version created build/, packaged, then
    # looked for the result inside build/ -- which is what killed v0.1.5 and
    # v0.1.6 with "mv: cannot stat 'superview-gui-linux-amd64'".
    #
    # The check below is the point of this step as much as the packaging is: if
    # the tool ever changes its output name or location again, this says so, in
    # this step, with a directory listing -- instead of failing two steps later
    # on a message that names the wrong thing.
    - name: Build GUI (native arch)
      run: |
        set -euo pipefail
        ARCH="$(go env GOARCH)"
        go run fyne.io/tools/cmd/fyne@v1.7.2 package -os linux -icon Icon.png -name "superview-gui-linux-${ARCH}" .
        if [ ! -f "superview-gui-linux-${ARCH}.tar.xz" ]; then
          echo "::error::fyne package did not produce superview-gui-linux-${ARCH}.tar.xz"
          echo "Working directory contains:"
          ls -lah
          exit 1
        fi

    - name: Name the archive for the release
      run: |
        set -euo pipefail
        version="${{ github.ref_name }}"
        arch="$(go env GOARCH)"
        case "$arch" in
          amd64) archLabel="x86_64" ;;
          386) archLabel="i386" ;;
          arm64) archLabel="aarch64" ;;
          *) archLabel="$arch" ;;
        esac
        # Keep the .tar.xz fyne produces rather than repacking it as .tar.gz:
        # it already carries the binary, the .desktop entry and the icon, which
        # is what makes the archive installable rather than just a loose binary.
        mv "superview-gui-linux-${arch}.tar.xz" "superview-gui-${version}-linux-${archLabel}.tar.xz"
        ls -lah "superview-gui-${version}-linux-${archLabel}.tar.xz"

    - name: Upload GUI artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gui-linux-artifacts
        path: superview-gui-${{ github.ref_name }}-linux-*.tar.xz
        if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-gui-windows, build-gui-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/RC-')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
    
    - name: List all artifacts
      run: |
        echo "=== Release Artifacts ==="
        find artifacts -type f | sort
    
    # Record bare filenames, not the artifact directory layout.
    #
    # The paths used to come out as artifacts/gui-linux-artifacts/<file>, so the
    # "sha256sum -c checksums.txt" the release notes advertise failed for anyone
    # who downloaded the assets: they arrive flat, not under that tree. v0.2.0
    # shipped with a checksums file that had to be corrected by hand before
    # publication.
    - name: Calculate checksums
      run: |
        set -euo pipefail
        find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar.xz" \) -print0 |
          while IFS= read -r -d '' file; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done > artifacts/checksums.txt
        echo "=== Checksums ===" && cat artifacts/checksums.txt
    
    - name: Create release summary
      run: |
        version="${GITHUB_REF_NAME}"
        echo "## Release ${version} - Superview" > /tmp/release.md
        echo "" >> /tmp/release.md
        echo "### GUI Application" >> /tmp/release.md
        echo "- Windows: native runner arch" >> /tmp/release.md
        echo "" >> /tmp/release.md
        echo "- Linux: native runner arch (Ubuntu 24.04 compatible)" >> /tmp/release.md
        echo "" >> /tmp/release.md
        echo "### Verify Integrity" >> /tmp/release.md
        echo "\`\`\`bash" >> /tmp/release.md
        echo "sha256sum -c checksums.txt" >> /tmp/release.md
        echo "\`\`\`" >> /tmp/release.md
        cat /tmp/release.md

    - name: Publish release assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        draft: true
        prerelease: ${{ startsWith(github.ref, 'refs/tags/RC-') }}
        body_path: /tmp/release.md
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
          artifacts/**/*.tar.xz
          artifacts/checksums.txt

  notify:
    name: Notify Release Status
    needs: [test, build-gui-windows, build-gui-linux, create-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    # This step used to print "✅ Release workflow completed / Tests: PASSED"
    # unconditionally, under if: always(). So the v0.1.5 and v0.1.6 runs ended
    # on a green, congratulatory summary while the Linux build had failed and no
    # release had been created at all. Nobody noticed for over a month, and the
    # published version stayed three tags behind. A summary that cannot report
    # failure is worse than no summary.
    - name: Report what actually happened
      run: |
        set -uo pipefail
        echo "Tests:          ${{ needs.test.result }}"
        echo "Windows build:  ${{ needs.build-gui-windows.result }}"
        echo "Linux build:    ${{ needs.build-gui-linux.result }}"
        echo "Draft release:  ${{ needs.create-release.result }}"
        echo ""

        failed=0
        for result in "${{ needs.test.result }}" \
                      "${{ needs.build-gui-windows.result }}" \
                      "${{ needs.build-gui-linux.result }}"; do
          [ "$result" = "success" ] || failed=1
        done

        case "${{ needs.create-release.result }}" in
          success)
            echo "A draft release was created. Publishing it is still a manual step."
            ;;
          skipped)
            # Expected on a manual dispatch: the run is a dry run, artifacts are
            # built and uploaded but nothing is published.
            echo "No release created: this run is not on a tag."
            ;;
          *)
            failed=1
            ;;
        esac

        if [ "$failed" -ne 0 ]; then
          echo "::error::the release run did not complete successfully -- see the job results above"
          exit 1
        fi
        echo "Release run completed successfully."
