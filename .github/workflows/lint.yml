name: Lint & Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  # Dispatched by merge-on-label.yml once it has merged a pull request: the
  # push its GITHUB_TOKEN makes to master starts no workflow by itself, and
  # workflow_dispatch is the documented exception. See test.yml.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in sync with the version pinned in the golangci-lint job below.
  GOLANGCI_LINT_VERSION: v2.13.2
  # Pinned for the same reason golangci-lint is: an "@latest" tool is a
  # dependency that can change under a build with no commit of ours, and a
  # failure it causes looks exactly like a failure we caused.
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  # golangci-lint runs errcheck, govet, ineffassign, staticcheck and unused --
  # see .golangci.yml. Separate "go vet" and "staticcheck" jobs used to sit
  # here repeating two of those. The staticcheck one also ran without the
  # SA*/S1* filter the config sets, so it enforced the ST* and QF* families
  # that .golangci.yml disables on purpose (one QF rewrite would reshape the
  # math.Pow calls in GeneratePGM, which must stay readable against the
  # reference algorithm). Two jobs contradicting the config is worse than no
  # jobs; the config is the single place that decides.
  #
  # This job and the vulnerability scan stay separate although both install
  # the same headers: they run side by side (3m35 and 2m24 on 801660d), and
  # one job doing both would take their sum. Their names are required checks
  # of the master ruleset, too.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache-dependency-path: go.sum

    # Required to type-check the cmd/superview package (Fyne GUI, cgo).
    - name: Install GUI build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    # The linter is compiled from source by "go install", which is most of the
    # step's three minutes and produces the same binary every run until the
    # pin or the Go version moves -- both are in the key. The Go version is
    # there because golangci-lint analyses with the Go it was built with, and
    # a binary from an older patch release would read the newer one's code
    # with the older one's rules.
    - name: Cache the golangci-lint binary
      id: lint-bin
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin/golangci-lint
        key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}

    - name: Install golangci-lint
      if: steps.lint-bin.outputs.cache-hit != 'true'
      run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

    - name: Run golangci-lint
      run: |
        "$(go env GOPATH)/bin/golangci-lint" version
        "$(go env GOPATH)/bin/golangci-lint" run ./... --timeout=5m

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # check-latest, here and on every setup-go step: without it '1.26.x' means
    # whatever patch release the runner image has cached, not the newest one.
    # Go 1.26.9 fixed nine standard-library vulnerabilities while the images
    # still carried 1.26.8, and this job went red on every pull request (M-05).
    - name: Setup Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache-dependency-path: go.sum

    - name: Install GUI build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    # Same reasoning as the linter's binary cache above. The Go version is in
    # the key because the scan's verdict on the standard library is the one of
    # the toolchain that built the binary (M-05).
    - name: Cache the govulncheck binary
      id: vuln-bin
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin/govulncheck
        key: govulncheck-${{ env.GOVULNCHECK_VERSION }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}

    - name: Install govulncheck
      if: steps.vuln-bin.outputs.cache-hit != 'true'
      run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

    - name: Run govulncheck
      run: |
        "$(go env GOPATH)/bin/govulncheck" -version
        "$(go env GOPATH)/bin/govulncheck" ./...

  fmt:
    name: Code Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # cache: false, and it matters more than it looks. gofmt reads no module,
    # so this job's module and build caches are empty -- and setup-go saves
    # them anyway, under the same key every Linux job with this go.sum and Go
    # version uses, seven seconds into the run, before any other job can. A
    # cache key is written once, so every other job then restored 7.5 KB
    # (801660d) and compiled Fyne's cgo from nothing, on every run, for months.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache: false

    - name: Check gofmt
      run: |
        dfmt=$(gofmt -l .)
        if [ -n "$dfmt" ]; then
          echo "Formatting issues found:"
          echo "$dfmt"
          exit 1
        fi
        echo "✅ Code formatting is correct"

  # README.md and README_FR.md are one document in two languages. The defect
  # this guards against is U-06's, doubled: a section that stops being true
  # survives because nobody was reminded the other file says it too.
  readme-parity:
    name: README parity (EN/FR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Compares the sequence of heading levels, never the titles: the French
    # ones are translated, their shape is not. Fenced blocks are skipped so a
    # "#" opening a comment inside one is not read as a heading.
    - name: The two READMEs have the same shape
      run: |
        set -euo pipefail
        shape() {
          awk '
            /^```/            { fence = !fence; next }
            !fence && /^#+ /  { print substr($0, 1, index($0, " ") - 1) }
          ' "$1"
        }
        if ! diff -u <(shape README.md) <(shape README_FR.md); then
          echo "::error file=README_FR.md::README.md and README_FR.md no longer have the same sections. One file gained or lost a heading the other did not."
          exit 1
        fi
        echo "✅ Both READMEs have the same section structure"

    # A section can be rewritten without its heading moving, and the shape
    # check would see nothing. On a pull request, also require both files.
    - name: The two READMEs changed together
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # The API, not git: on pull_request the checkout is refs/pull/N/merge,
        # and base.sha is not in a fetch-depth 1 clone, so a git diff against
        # it fails with "bad object". --paginate because the endpoint stops at
        # 30 files.
        files="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename')"
        # A here-string, not a pipe: with pipefail, "printf | grep -q" reports
        # 141 when grep exits early on a match, which would invert the test
        # exactly when the file is present.
        en=0; fr=0
        if grep -qxF 'README.md'    <<<"$files"; then en=1; fi
        if grep -qxF 'README_FR.md' <<<"$files"; then fr=1; fi
        if [ "$en" -ne "$fr" ]; then
          if [ "$en" -eq 1 ]; then missing=README_FR.md; else missing=README.md; fi
          echo "::error file=${missing}::This pull request changes one README and not the other. A reader following a stale install step is exactly the reader these files exist for. Make the same change in ${missing}."
          exit 1
        fi
        echo "✅ Both READMEs were updated together"
