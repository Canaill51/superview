name: Lint & Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  # Dispatched by merge-on-label.yml once it has merged a pull request: the
  # push its GITHUB_TOKEN makes to master starts no workflow by itself, and
  # workflow_dispatch is the documented exception.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # README.md and README_FR.md are one document in two languages. The defect
  # this guards against is U-06's, doubled: a section that stops being true
  # survives because nobody was reminded the other file says it too.
  readme-parity:
    name: README parity (EN/FR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Compares the sequence of heading levels, never the titles: the French
    # ones are translated, their shape is not. Fenced blocks are skipped so a
    # "#" opening a comment inside one is not read as a heading.
    - name: The two READMEs have the same shape
      run: |
        set -euo pipefail
        shape() {
          awk '
            /^```/            { fence = !fence; next }
            !fence && /^#+ /  { print substr($0, 1, index($0, " ") - 1) }
          ' "$1"
        }
        if ! diff -u <(shape README.md) <(shape README_FR.md); then
          echo "::error file=README_FR.md::README.md and README_FR.md no longer have the same sections. One file gained or lost a heading the other did not."
          exit 1
        fi
        echo "✅ Both READMEs have the same section structure"

    # A section can be rewritten without its heading moving, and the shape
    # check would see nothing. On a pull request, also require both files.
    - name: The two READMEs changed together
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # The API, not git: on pull_request the checkout is refs/pull/N/merge,
        # and base.sha is not in a fetch-depth 1 clone, so a git diff against
        # it fails with "bad object". --paginate because the endpoint stops at
        # 30 files.
        files="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename')"
        # A here-string, not a pipe: with pipefail, "printf | grep -q" reports
        # 141 when grep exits early on a match, which would invert the test
        # exactly when the file is present.
        en=0; fr=0
        if grep -qxF 'README.md'    <<<"$files"; then en=1; fi
        if grep -qxF 'README_FR.md' <<<"$files"; then fr=1; fi
        if [ "$en" -ne "$fr" ]; then
          if [ "$en" -eq 1 ]; then missing=README_FR.md; else missing=README.md; fi
          echo "::error file=${missing}::This pull request changes one README and not the other. A reader following a stale install step is exactly the reader these files exist for. Make the same change in ${missing}."
          exit 1
        fi
        echo "✅ Both READMEs were updated together"

  # The Claude Code hooks in .claude/hooks read their JSON input with perl. They
  # read it with python3 until 2026-10-26, which on Windows is the Microsoft Store
  # stub: all three hooks saw an empty field and said nothing. The check shadows
  # python3 with a failing stub, so Linux reproduces that machine.
  claude-hooks:
    name: Claude Code hooks read their input
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: The hooks pass their check
      run: bash scripts/checks/hooks.sh

  # scripts/checks/rust.sh refuses to run the tests when it cannot find ffmpeg.
  # Until 2026-10-26 it searched PATH only, and refused a Windows machine whose
  # ffmpeg lives in SUPERVIEW_FFMPEG_DIR, where the suite passes. The check
  # empties PATH so the runner's own ffmpeg cannot answer for the directory.
  ffmpeg-lookup:
    name: The checks find ffmpeg where the tests do
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: The ffmpeg lookup passes its check
      run: bash scripts/checks/outils.sh
