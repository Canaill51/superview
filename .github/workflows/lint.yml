name: Lint & Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

env:
  # Keep in sync with the version pinned in the golangci-lint job below.
  GOLANGCI_LINT_VERSION: v2.13.2
  # Pinned for the same reason golangci-lint is: an "@latest" tool is a
  # dependency that can change under a build with no commit of ours, and a
  # failure it causes looks exactly like a failure we caused.
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  # golangci-lint runs errcheck, govet, ineffassign, staticcheck and unused --
  # see .golangci.yml. Separate "go vet" and "staticcheck" jobs used to sit
  # here repeating two of those. The staticcheck one also ran without the
  # SA*/S1* filter the config sets, so it enforced the ST* and QF* families
  # that .golangci.yml disables on purpose (one QF rewrite would reshape the
  # math.Pow calls in GeneratePGM, which must stay readable against the
  # reference algorithm). Two jobs contradicting the config is worse than no
  # jobs; the config is the single place that decides.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    # Required to type-check the root package (Fyne GUI, cgo).
    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Run golangci-lint
      run: |
        go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
        "$(go env GOPATH)/bin/golangci-lint" run ./... --timeout=5m

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    - name: Install GUI build dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

    - name: Run govulncheck
      run: |
        go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
        "$(go env GOPATH)/bin/govulncheck" ./...

  fmt:
    name: Code Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'

    - name: Check gofmt
      run: |
        dfmt=$(gofmt -l .)
        if [ -n "$dfmt" ]; then
          echo "Formatting issues found:"
          echo "$dfmt"
          exit 1
        fi
        echo "✅ Code formatting is correct"
