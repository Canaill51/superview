# Shapes the notes GitHub generates for a release (DEC-72).
#
# The list comes from the pull requests merged since the previous release, each
# filed under the section of its "RN: ..." label. GitHub drops a pull request
# that matches no section, and there is no catch-all on purpose: the
# pr-label.yml workflow refuses a pull request without exactly one RN label, so
# nothing can go missing silently, and a catch-all would only hide a forgotten
# label. Every label below is in that workflow's list, and the reverse
# (crates/superview-app/src/repo_guards.rs checks it); CONTRIBUTING.md says
# which label to pick.
changelog:
  exclude:
    labels:
      - "RN: ignore"   # CI, tooling, plans, registers, internal documents
  categories:
    - title: New features
      labels:
        - "RN: major feature"
        - "RN: feature"
    - title: Improvements
      labels:
        - "RN: improvement"
        - "RN: security"
        - "RN: refactor"
    - title: Fixes
      labels:
        - "RN: fix"
    # Dependabot, kept last: the weekly cargo updates add up, so on a long
    # release these would otherwise outnumber and bury the work worth reading
    # about. Its pull requests carry "dependencies" and no RN label.
    - title: Dependencies
      labels:
        - dependencies
