name: Feature request
description: Something Superview or its Resolve plugin cannot do yet
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What you want to do, and with which videos (camera, resolution, frame rate).
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround or the other tool you use, if any.
