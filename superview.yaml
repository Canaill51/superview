# Superview Configuration File
# All values can be overridden with environment variables prefixed with SUPERVIEW_

# Bitrate constraints in BITS per second, the unit ffprobe reports and ffmpeg's
# -b:v expects. The values below have always been bits; only the wording was
# wrong, so a configuration written against the old comments was off by 8x.
# 102400 bits/sec    = ~0.1 Mbps (minimum quality)
# 209715200 bits/sec = ~200 Mbps (excellent quality, large files)
min_bitrate: 102400
max_bitrate: 209715200

# Temporary directory prefix for encoding sessions (absolute temp dir)
temp_dir_prefix: "superview-*"

# Encoder codec preferences to filter from available encoders
# Supports: 264 (H.264), 265 (H.265/HEVC)
encoder_codecs:
  - "264"
  - "265"
  - "hevc"

# Logging level: debug, info, warn, error
log_level: info

# Performance mode (audio handling only):
# - safe: always re-encode audio to AAC (maximum container compatibility)
# - safe_performance: copy the audio stream untouched, falling back to AAC if
#   the copy is rejected -- faster and lossless for audio
# Note: neither mode throttles the encode. The "-re" realtime input flag was
# removed because it only applies to streaming, not to file output.
performance_mode: safe_performance

# Which ffmpeg is used is deliberately NOT a key here: it is the environment variable
# SUPERVIEW_FFMPEG_DIR, naming a directory that holds ffmpeg and ffprobe. It takes
# precedence over the copy shipped in the release archive and over PATH. A config key
# would be read too late -- the tools are resolved before this file is loaded.

# Optional ffmpeg tuning (safe defaults)
# video_preset: empty uses ffmpeg default preset
# Common presets: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
video_preset: ""

# filter_threads: number of threads for ffmpeg filter graph
# 0 means auto/default behavior
filter_threads: 0

# encoder_threads: number of threads for ffmpeg encoder
# 0 means auto/default behavior
encoder_threads: 0
