# Superview Configuration File
# All values can be overridden with environment variables prefixed with SUPERVIEW_

# Bitrate constraints in bytes/second (used by GPU-friendly quality profiles)
# 100k bytes/sec = ~0.1 Mbps (minimum quality)
# 209M bytes/sec = ~200 Mbps (excellent quality, large files)
min_bitrate: 102400
max_bitrate: 209715200

# Quality preset for CLI/advanced users (balanced, fast)
# Used by GUI profiles to pick bitrate/preset strategy.
quality_preset: balanced

# Temporary directory prefix for encoding sessions (absolute temp dir)
temp_dir_prefix: "superview-*"

# Encoder codec preferences to filter from available encoders
# Supports: 264 (H.264), 265 (H.265/HEVC)
encoder_codecs:
  - "264"
  - "265"
  - "hevc"

# Logging level: debug, info, warn, error
log_level: info

# Performance mode:
# - safe: keep legacy behavior (realtime throttle + AAC re-encode)
# - safe_performance: remove realtime throttle and try audio copy first
performance_mode: safe_performance

# Optional ffmpeg tuning (safe defaults)
# video_preset: empty uses ffmpeg default preset
# Common presets: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
video_preset: ""

# filter_threads: number of threads for ffmpeg filter graph
# 0 means auto/default behavior
filter_threads: 0

# encoder_threads: number of threads for ffmpeg encoder
# 0 means auto/default behavior
encoder_threads: 0

# Minimum video dimensions in pixels
min_video_width: 320
min_video_height: 240
