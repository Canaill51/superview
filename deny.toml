# cargo-deny, run by the job "Rust coverage and audit" (.github/workflows/rust.yml) and by
# `make coverage-audit`. Four checks: known advisories and yanked crates, licences compatible
# with GPL-3.0-or-later, bans (no wildcard version), and sources -- crates.io and the one pinned
# git fork, nothing else.

[graph]
# The shipped binaries are Linux and Windows only; build tools are not audited as dependencies.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
# A crate pulled from crates.io ("yanked") fails the job like a vulnerability: its author withdrew
# it, usually for a defect. Update it; `--locked` would otherwise keep it in the build for good.
yanked = "deny"
# A vulnerability fails the job. The way out is a reasoned, dated `ignore` below, never removing
# the step. These are crates flagged "unmaintained", not vulnerable, and none is ours to
# replace: they come in through Slint's winit backend (zbus; sctk-adwaita -> ab_glyph ->
# ttf-parser), whose latest releases (slint 1.18.1) still use them. Reopen on each Slint update:
# zbus 6 absorbs zvariant, and skrifa replaces ttf-parser. (paste is the exception: it comes in
# through the ofx fork of superview-ofx, DEC-65. bincode, RUSTSEC-2025-0141, is in
# Cargo.lock only through an inactive optional dependency; cargo-deny does not see it.)
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 unmaintained (2026-06-28); via winit -> sctk-adwaita -> ab_glyph, awaiting an upstream move to skrifa" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (2026-10-16); via slint's winit backend -> zbus 5, awaiting zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (2026-10-16); via slint's winit backend -> zbus 5, awaiting zbus 6" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained (2024-10-07); a proc-macro of the ofx fork (superview-ofx, DEC-65), run at build time only, no vulnerability; awaiting the fork's move to pastey" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (2026-10-16); via slint's winit backend -> zbus 5, awaiting zbus 6" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.1 unmaintained, no successor release; via spin_on, used by slint-build and slint-macros at build time only, no vulnerability; awaiting Slint dropping spin_on" },
]

[licenses]
# Superview is GPL-3.0-or-later. Where a crate offers a choice, one permissive alternative must
# be on this list; slint is used under GPL-3.0-only, one of the three licences it offers.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

[bans]
# Duplicate versions are not reported: Slint's and winit's trees hold sixteen (2026-11-12), none
# ours to merge, and their 1,300 lines of warnings would bury a real failure in the CI log.
multiple-versions = "allow"
# A `*` version would take whatever crates.io serves next. The workspace's own crates are paths
# (`path = "../superview-core"`), without a version: those are allowed.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# A dependency from anywhere else -- another registry, another git repository, a fork swapped in
# by a [patch] -- fails the job instead of entering the build unseen. The one git source is the
# ofx fork of superview-ofx (DEC-65), pinned to a revision in Cargo.toml.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/AdrianEddy/ofx-rs.git"]
